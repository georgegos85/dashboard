<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard Comercial Avançado</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; } 
.recharts-cartesian-grid-horizontal line { stroke: #f1f5f9; }
.custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; } .custom-scroll::-webkit-scrollbar-track { background: #f8fafc; } .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; }
.modal-scroll::-webkit-scrollbar { width: 6px; height: 6px; } .modal-scroll::-webkit-scrollbar-track { background: #f1f5f9; } .modal-scroll::-webkit-scrollbar-thumb { background: #94a3b8; }
@media print { @page { size: landscape; margin: 10mm; } body { background-color: #ffffff !important; } .no-print { display: none !important; } .print-force-bg { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; } #main-dashboard-export-area { transform: scale(0.95); transform-origin: top left; width: 100%; gap: 10px; } .shadow-sm, .shadow-md, .shadow-xl { box-shadow: none !important; border: 1px solid #e2e8f0 !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, BarChart, Bar, Cell, Treemap, Legend, ReferenceLine, ScatterChart, Scatter, ZAxis, ComposedChart } = window.Recharts;

const USUARIOS = [{ nome: "Diretoria (Admin)", estados: "ALL", role: "admin", hash: "YWRtaW4uZGly" }];

const SVG_PATHS = { 
  TrendingUp: `<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>`, 
  TrendingDown: `<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>`, 
  Search: `<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>`, 
  ChevronDown: `<polyline points="6 9 12 15 18 9"/>`, 
  MapPin: `<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>`, 
  Truck: `<rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle>`, 
  Users: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`, 
  X: `<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`, 
  Clock: `<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>`, 
  Package: `<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>`, 
  List: `<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>`, 
  AlertCircle: `<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>`, 
  UserPlus: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>`, 
  UserMinus: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="22" y1="11" x2="16" y2="11"/>`, 
  Bell: `<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path>`, 
  Loader2: `<path d="M21 12a9 9 0 1 1-6.219-8.56"/>`, 
  Upload: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>`, 
  Target: `<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>`, 
  Download: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`, 
  BookOpen: `<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>`, 
  FileSpreadsheet: `<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line>` 
};

const Icon = ({ name, size = 16, className = "" }) => SVG_PATHS[name] ? <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`inline-flex items-center justify-center ${name==='Loader2'?'animate-spin':''} ${className}`} width={size} height={size} dangerouslySetInnerHTML={{ __html: SVG_PATHS[name] }} /> : null;
const CHART_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#64748b', '#14b8a6'];
const MONTH_NAMES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
const removeAccents = (str) => str ? String(str).normalize('NFD').replace(/[\u0300-\u036f]/g, '') : '';
const formatCurrency = (val) => { const n=Number(val)||0; if(n>=1e9)return "R$ "+(n/1e9).toFixed(2).replace('.',',')+" Bi"; if(n>=1e6)return "R$ "+(n/1e6).toFixed(2).replace('.',',')+" Mi"; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); };
const formatShortNum = (val) => { const n=Number(val)||0; if(n>=1e9)return (n/1e9).toFixed(1).replace('.',',')+"Bi"; if(n>=1e6)return (n/1e6).toFixed(1).replace('.',',')+"M"; if(n>=1e3)return (n/1e3).toFixed(1).replace('.',',')+"k"; return n.toLocaleString('pt-BR'); };
const formatCnpj = (cnpj) => { const s=String(cnpj||'').replace(/\D/g,''); return s.length===14?s.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5"):String(cnpj||''); };
const formatYAxisTick = (val) => String(val||'').length>15?String(val||'').substring(0,15)+'...':String(val||'');
const getRankBadge = (r) => { if(!r)return null; const n=Number(r); if(n<=20)return <span className="bg-amber-100 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded text-[8px] font-black shrink-0">TOP 20 (#{n})</span>; if(n<=50)return <span className="bg-blue-100 text-blue-700 border border-blue-200 px-1.5 py-0.5 rounded text-[8px] font-black shrink-0">TOP 50 (#{n})</span>; if(n<=100)return <span className="bg-emerald-100 text-emerald-700 border border-emerald-200 px-1.5 py-0.5 rounded text-[8px] font-black shrink-0">TOP 100 (#{n})</span>; return <span className="bg-slate-100 text-slate-600 border border-slate-200 px-1.5 py-0.5 rounded text-[8px] font-black shrink-0">RANK #{n}</span>; };
const exportToExcel = (dataToExport, title, showToastCallback) => { if(!dataToExport || dataToExport.length===0){if(showToastCallback)showToastCallback("Sem dados."); return;} const h=Object.keys(dataToExport[0]); const csvLines=[h.join(';')]; dataToExport.forEach(row=>{csvLines.push(h.map(k=>'"'+String(row[k]||'').replace(/"/g,'""')+'"').join(';'));}); const b=new Blob(['\uFEFF'+csvLines.join('\n')],{type:'text/csv;charset=utf-8;'}); const l=document.createElement('a'); l.href=URL.createObjectURL(b); l.download=title+".csv"; document.body.appendChild(l); l.click(); document.body.removeChild(l); if(showToastCallback)showToastCallback("Exportado com sucesso!"); };
const renderClientCell = (r) => { const n=r.name||r._customer||r.Cliente||'N/I'; const c=formatCnpj(r.cnpj); const t=r.customerType||r._customerType||r.Tipo||'N/I'; return (<div><div className="font-bold text-slate-800 truncate max-w-[150px] md:max-w-[200px]" title={n}>{String(n)}</div><div className="text-[7px] text-slate-400 mt-0.5 flex items-center gap-1"><span>{c || 'Sem CNPJ'}</span><span className="text-slate-300">&bull;</span><span className="truncate max-w-[100px]">{t}</span></div></div>); };

const parseNum = v => {
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return v;
    let s = String(v).trim(); if (!s || s === '-') return 0;
    s = s.replace(/[^0-9.,-]/g, '');
    const hasComma = s.includes(','); const hasDot = s.includes('.');
    if (hasComma && hasDot) {
        const commaIdx = s.lastIndexOf(','); const dotIdx = s.lastIndexOf('.');
        if (commaIdx > dotIdx) { s = s.replace(/\./g, '').replace(',', '.'); } else { s = s.replace(/,/g, ''); }
    } else if (hasComma) {
        const parts = s.split(','); if (parts.length === 2 && parts[1].length <= 3) { s = s.replace(',', '.'); } else { s = s.replace(/,/g, ''); }
    } else if (hasDot) {
        const parts = s.split('.'); if (parts.length === 2 && parts[1].length <= 3) {} else { s = s.replace(/\./g, ''); }
    }
    return parseFloat(s) || 0;
};

const DebouncedInput = ({ value, onChange, placeholder, icon }) => { 
  const [localVal, setLocalVal] = useState(value || ''); 
  useEffect(() => { setLocalVal(value || ''); }, [value]); 
  useEffect(() => { 
    if (localVal === (value || '')) return;
    const id = setTimeout(() => { onChange(localVal); }, 350); return () => clearTimeout(id); 
  }, [localVal, value, onChange]); 
  return (
    <div className="relative flex items-center h-[26px]">
      <Icon name={icon} className="absolute left-2 text-slate-400 pointer-events-none" size={10} />
      <input type="text" placeholder={placeholder} value={localVal} onChange={e => setLocalVal(e.target.value)} className="w-full h-full pl-6 pr-6 bg-white border border-slate-200 rounded-md text-[9px] font-semibold focus:ring-1 focus:ring-blue-500 outline-none text-slate-700 shadow-sm" />
      {localVal && <button onClick={() => { setLocalVal(''); onChange(''); }} className="absolute right-0 w-6 h-full flex items-center justify-center text-slate-400 hover:text-rose-500"><Icon name="X" size={10} /></button>}
    </div>
  ); 
};

const CustomSelect = ({ label, options = [], selected, onChange, placeholder, multi = false, searchable = false }) => {
  const [isOpen, setIsOpen] = useState(false); const [term, setTerm] = useState(''); const ref = useRef(null);
  useEffect(() => {
    const clickOut = (e) => { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); };
    document.addEventListener('mousedown', clickOut); return () => document.removeEventListener('mousedown', clickOut);
  }, []);
  const filtered = searchable && term ? options.filter(o => removeAccents(String(o.label || '')).toLowerCase().includes(removeAccents(term.toLowerCase()))) : options;
  const displayLabel = multi ? (selected.length === 0 ? placeholder : selected.length === options.length ? 'Todos' : selected.length + ' sel.') : (options.find(o => o.value === selected)?.label || placeholder);
  return (
    <div className="relative flex flex-col gap-0.5 min-w-[100px] flex-1" ref={ref}>
      {label && <label className="text-[8px] font-black text-slate-400 uppercase tracking-wider">{label}</label>}
      <div className="bg-white border border-slate-200 rounded-md px-2 py-1 text-[9px] font-bold text-slate-700 cursor-pointer flex justify-between items-center shadow-sm h-[26px] hover:bg-slate-50" onClick={() => setIsOpen(!isOpen)}>
        <span className="truncate max-w-[150px]">{String(displayLabel)}</span>
        <Icon name="ChevronDown" size={10} className="text-slate-400 ml-1 shrink-0" />
      </div>
      {isOpen && (
        <div className="absolute top-[105%] left-0 w-full min-w-[180px] bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-56 flex flex-col overflow-hidden">
          {searchable && (
            <div className="p-1 border-b border-slate-100 bg-slate-50 flex items-center relative">
              <Icon name="Search" size={10} className="text-slate-400 absolute left-2 pointer-events-none" />
              <input type="text" placeholder="Buscar..." className="w-full pl-6 pr-5 py-1 text-[9px] font-semibold bg-white border border-slate-200 rounded outline-none" onChange={e => setTerm(e.target.value)} value={term} />
            </div>
          )}
          <div className="overflow-y-auto custom-scroll p-1 flex flex-col gap-0.5 max-h-[160px]">
            {multi && (
              <label className="flex items-center gap-1.5 text-[9px] font-bold text-slate-800 cursor-pointer px-2 py-1 hover:bg-slate-100 rounded">
                <input type="checkbox" checked={options.length > 0 && options.every(o => selected.includes(o.value))} onChange={() => {
                  if (options.every(o => selected.includes(o.value))) onChange([]); else onChange(options.map(o => o.value));
                }} className="w-2.5 h-2.5 accent-blue-600 rounded flex-shrink-0" />
                <span>Selecionar Todos</span>
              </label>
            )}
            {filtered.map(o => (
              <label key={String(o.value)} onClick={() => { if (!multi) { onChange(o.value); setIsOpen(false); setTerm(''); } }} className={`flex items-center gap-1.5 text-[9px] font-semibold cursor-pointer px-2 py-1 rounded ${!multi && selected === o.value ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`}>
                {multi && <input type="checkbox" checked={selected.includes(o.value)} onChange={() => {
                  if (selected.includes(o.value)) onChange(selected.filter(x => x !== o.value)); else onChange([...selected, o.value]);
                }} className="w-2.5 h-2.5 accent-blue-600 rounded flex-shrink-0" />}
                <span className="truncate">{String(o.label)}</span>
              </label>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

const CustomMultiSelect = ({ label, options, selected = [], onChange, placeholder, searchable }) => <CustomSelect label={label} options={options} selected={selected} onChange={onChange} placeholder={placeholder} searchable={searchable} multi={true} />;

const DataTable = ({ cols, data, footer, onRowClick, selectedRowValue, rowKey="name" }) => (
  <div className="w-full overflow-x-auto custom-scroll">
    <table className="w-full text-left border-collapse min-w-full">
      <thead className="bg-slate-50 sticky top-0 shadow-sm z-10">
        <tr className="text-[8px] font-black text-slate-400 uppercase tracking-wider border-b border-slate-100">
          {cols.map((c, i) => (
            <th key={i} onClick={c.sort} className={`px-2 py-1.5 ${c.align || 'text-left'} ${c.sort ? 'cursor-pointer hover:bg-slate-100' : ''}`}>
              <div className={`flex items-center gap-1 ${c.align === 'text-right' ? 'justify-end' : c.align === 'text-center' ? 'justify-center' : ''} ${c.activeSort ? 'text-blue-600' : ''}`}>
                {String(c.label)} {c.activeSort && <Icon name="ChevronDown" size={8} className={c.sortDir === 'asc' ? 'rotate-180' : ''} />}
              </div>
            </th>
          ))}
        </tr>
      </thead>
      <tbody className="bg-white">
        {data.map((r, i) => (
          <tr key={i} onClick={() => onRowClick && onRowClick(r)} className={`border-b border-slate-50 text-[9px] ${onRowClick ? 'cursor-pointer' : ''} ${selectedRowValue && selectedRowValue === r[rowKey] ? 'bg-blue-50 border-l-2 border-blue-500' : 'hover:bg-slate-50 border-l-2 border-transparent'}`}>
            {cols.map((c, j) => <td key={j} className={`px-2 py-1.5 ${c.align || 'text-left'}`}>{c.val(r, i)}</td>)}
          </tr>
        ))}
        {data.length === 0 && <tr><td colSpan={cols.length} className="py-4 text-center text-[9px] text-slate-400 font-bold">Sem dados.</td></tr>}
      </tbody>
      {footer && <tfoot className="bg-slate-50 sticky bottom-0 shadow-inner">{footer}</tfoot>}
    </table>
  </div>
);

const renderBarLabel = (isFat, color) => (p) => {
  if (!p.value) return null;
  return <text x={(p.x||0)+(p.width||0)+4} y={(p.y||0)+(p.height||0)/2+1} fill={color} textAnchor="start" dominantBaseline="central" fontSize="8" fontWeight="bold">{isFat ? formatShortNum(p.value) : Number(p.value).toLocaleString('pt-BR')}</text>;
};

const MiniBarChart = ({ data, color, isFat, title }) => (
  <div className="bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex flex-col h-full w-full relative">
    <h4 className="text-[8px] font-black text-slate-500 uppercase tracking-wider mb-1 shrink-0">{String(title)}</h4>
    <div className="flex-1 w-full min-h-[100px] h-full absolute inset-0 pt-6 pb-2 px-2">
      <ResponsiveContainer width="100%" height="100%">
        <BarChart data={data} layout="vertical" margin={{left: 0, right: 30, top: 0, bottom: 0}}>
          <XAxis type="number" hide />
          <YAxis dataKey="name" type="category" width={90} axisLine={false} tickLine={false} tickFormatter={formatYAxisTick} tick={{fontSize:8,fontWeight:700,fill:'#64748b'}} interval={0} />
          <Tooltip formatter={(v) => [isFat ? formatCurrency(v) : (Number(v).toLocaleString('pt-BR') + " un"), isFat ? 'Faturamento' : 'Quantidade']} cursor={{fill: '#f8fafc'}} contentStyle={{fontSize: '9px', fontWeight: 'bold'}} />
          <Bar dataKey={isFat ? "valor" : "qty"} fill={color} radius={[0, 3, 3, 0]} barSize={10} label={renderBarLabel(isFat, color)} />
        </BarChart>
      </ResponsiveContainer>
    </div>
  </div>
);

const MiniLineChart = ({ data, isFat, setMode }) => (
  <div className="bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex flex-col h-full w-full relative">
    <div className="flex justify-between items-center mb-1 shrink-0 z-10 relative">
      <h4 className="text-[8px] font-black text-slate-500 uppercase tracking-wider">Evolução Mensal</h4>
      <div className="flex bg-slate-100 p-0.5 rounded-md no-print">
        <button onClick={() => setMode('faturamento')} className={`px-1.5 py-0.5 text-[7px] font-bold rounded transition-colors ${isFat ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>R$</button>
        <button onClick={() => setMode('quantidade')} className={`px-1.5 py-0.5 text-[7px] font-bold rounded transition-colors ${!isFat ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>Un.</button>
      </div>
    </div>
    <div className="flex-1 w-full min-h-[100px] h-full absolute inset-0 pt-8 pb-2 px-2">
      <ResponsiveContainer width="100%" height="100%">
        <LineChart data={data} margin={{ top: 5, right: 10, left: 15, bottom: 0 }}>
          <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
          <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 8, fontWeight: 600, fill: '#94a3b8'}} />
          <YAxis axisLine={false} tickLine={false} tick={{fontSize: 8, fontWeight: 600, fill: '#94a3b8'}} tickFormatter={v => formatShortNum(v)} width={35} />
          <Tooltip formatter={(v) => [isFat ? formatCurrency(v) : (Number(v || 0).toLocaleString('pt-BR') + " un"), isFat ? "Faturamento" : "Qtd."]} contentStyle={{fontSize: '9px', fontWeight: 'bold'}} />
          <Line type="monotone" dataKey={isFat ? 'valor' : 'qty'} name={isFat ? 'Faturamento' : 'Quantidade'} stroke="#3b82f6" strokeWidth={2.5} dot={{r: 2, fill: "#3b82f6", strokeWidth: 1.5, stroke: '#fff'}} />
        </LineChart>
      </ResponsiveContainer>
    </div>
  </div>
);

const CustomTreemapContentRecharts = (props) => {
  const { x, y, width, height, index, name, value, root } = props; if (width < 30 || height < 30) return null;
  const sName = String(name || ''); const pct = root && root.value ? ((value / root.value) * 100).toFixed(1) : 0;
  return (
    <g>
      <rect x={x} y={y} width={width} height={height} fill={CHART_COLORS[(index || 0) % CHART_COLORS.length]} stroke="#fff" strokeWidth={1} rx={3} ry={3} />
      {width > 50 && height > 30 && sName && <text x={x + width / 2} y={y + height / 2 - 5} textAnchor="middle" fill="#ffffff" stroke="#000000" strokeWidth={3} paintOrder="stroke" fontSize={9} fontWeight="900" dominantBaseline="central">{sName.length > 15 ? sName.substring(0, 15) + '...' : sName}</text>}
      {width > 50 && height > 30 && <text x={x + width / 2} y={y + height / 2 + 5} textAnchor="middle" fill="#ffffff" stroke="#000000" strokeWidth={2} paintOrder="stroke" fontSize={8} fontWeight="700" dominantBaseline="central">{formatShortNum(value)} ({pct}%)</text>}
    </g>
  );
};

const TooltipBox = ({ title, children }) => {
  const s = typeof title === 'object' && title !== null ? String(title.value || title.name || '') : String(title || '');
  return (<div className="bg-slate-900 p-2 rounded-xl shadow-2xl border border-slate-700 text-[9px] z-50 text-white min-w-[150px]">{s && <p className="font-black text-blue-300 mb-1 border-b border-slate-700 pb-1 truncate">{s}</p>}<div className="flex flex-col gap-0.5">{children}</div></div>);
};

                    if (d.isAll) { rawList = fullRankedProducts.map(p => ({...p, valor: p.curVal, qty: p.qtyCur})); tT = 'Ranking Geral de Venda de Produtos'; tI = 'Package'; tC = colsProd; } 
                    else { rawList = isF ? d.topClientsFat : d.topClientsQty; tT = 'Principais Clientes Compradores deste Produto'; tI = 'Users'; tC = colsCli; }
                }

                if (localModalSearch) {
                    const term = removeAccents(localModalSearch).toLowerCase().trim();
                    rawList = rawList.filter(item => 
                        removeAccents(String(item.name || '')).toLowerCase().includes(term) ||
                        removeAccents(String(item.cnpj || '')).toLowerCase().includes(term) ||
                        removeAccents(String(item.city || '')).toLowerCase().includes(term)
                    );
                }

                const tableDataToRender = rawList.map((item, idx) => ({ ...item, rank: idx + 1 }));

                return (
                    <div className="p-2 lg:p-3 flex flex-col gap-2 h-full">
                        <ActiveFiltersDisplay />
                        {modalInsight && <div className="bg-blue-50 border border-blue-200 text-blue-800 p-2 rounded-lg text-[9px] font-bold shadow-sm flex items-center gap-1.5 shrink-0 print-force-bg"><Icon name="Target" size={12}/> {modalInsight}</div>}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-2 shrink-0">
                            {cards.map((x,i) => (<div key={i} className="bg-white p-2.5 rounded-xl shadow-sm border border-slate-200"><div className="flex justify-between items-start"><p className="text-[7px] font-black text-slate-400 uppercase">{String(x.t1)}</p>{x.b}</div><h3 className="text-lg font-black mt-1 text-blue-600">{String(x.v1)}</h3>{x.g1 !== undefined ? (<div className="mt-1"><span className={`px-1.5 py-0.5 rounded text-[8px] font-bold ${x.g1>0?'bg-emerald-50 text-emerald-600':x.g1<0?'bg-rose-50 text-rose-600':'bg-slate-50 text-slate-500'} print-force-bg`}>{x.g1>0?'+':''}{Number(x.g1 || 0).toFixed(1)}% vs Ant.</span></div>) : (<p className="text-[8px] text-slate-400 font-bold mt-1">{String(x.s)}</p>)}</div>))}
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-2 h-[220px] min-h-[220px] max-h-[220px] shrink-0">
                            <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-200 flex flex-col h-full relative"><MiniLineChart data={d.monthlyTrend} isFat={isF} setMode={setModalEvolucaoMode}/></div>
                            <div className="flex flex-col h-full relative"><MiniBarChart data={bD.slice(0, 5)} color={bC} isFat={isF} title={bT}/></div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-1 min-h-[200px]">
                            <h4 className="text-[8px] font-black text-slate-800 uppercase p-2 bg-slate-50 border-b border-slate-100 flex items-center gap-1.5 shrink-0 print-force-bg"><Icon name={tI} size={12} className="text-blue-600"/> {tT}</h4>
                            <div className="overflow-y-auto custom-scroll flex-1 min-h-0"><DataTable cols={tC} data={tableDataToRender} /></div>
                        </div>
                    </div>
                );
            }
        }

        if (modalConfig.type === 'analitico') {
            const colsAn = [ {label:'Data', val:r=><span className="font-bold text-slate-800">{String(r._displayDate)}</span>, sort:()=>setAnaliticoSortConfig(p=>({column:'data',direction:p.column==='data'&&p.direction==='desc'?'asc':'desc'})), activeSort:analiticoSortConfig.column==='data', sortDir:analiticoSortConfig.direction}, {label:'Cliente', val:r=>renderClientCell(r)}, {label:'UF', align:'text-center', val:r=><span className="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[7px] font-bold">{String(r._state)}</span>}, {label:'Cidade', val:r=>String(r._city)}, {label:'Distribuidor', val:r=><div className="font-bold text-slate-700 truncate max-w-[100px]">{String(r._distributor)}</div>}, {label:'Produto', val:r=><div className="font-bold text-slate-700 truncate max-w-[100px]">{String(r._product)}</div>}, {label:'Qtd', align:'text-right', val:r=><span className="font-bold text-slate-800">{Number(r._qty)}</span>}, {label:'Fat.', align:'text-right', val:r=><span className="font-bold text-slate-800">{formatCurrency(r._amount)}</span>, sort:()=>setAnaliticoSortConfig(p=>({column:'faturamento',direction:p.column==='faturamento'&&p.direction==='desc'?'asc':'desc'})), activeSort:analiticoSortConfig.column==='faturamento', sortDir:analiticoSortConfig.direction}, {label:'Preço Unit.', align:'text-right', val:r=><span className="font-bold text-blue-600">{r._qty>0?formatCurrency(r._amount/r._qty):'-'}</span>} ];
            return (
                <div className="p-2 lg:p-4 h-full flex flex-col">
                    <ActiveFiltersDisplay />
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-1">
                        <div className="overflow-y-auto custom-scroll flex-1"><DataTable cols={colsAn} data={modalDataFiltered.slice(0, 500)} footer={<tr className="text-[8px] font-black text-slate-800 uppercase tracking-wider border-t border-slate-200 bg-slate-100 print-force-bg"><td colSpan="6" className="py-2 px-3 text-right">TOTAL DA SELEÇÃO ATUAL:</td><td className="py-2 px-3 text-right">{totalAnaliticoQtd.toLocaleString('pt-BR')} un</td><td className="py-2 px-3 text-right text-emerald-600">{formatCurrency(totalAnaliticoFat)}</td><td className="py-2 px-3 text-right text-blue-600">{formatCurrency(precoMedioAnalitico)}</td></tr>} /></div>
                    </div>
                </div>
            );
        }

        if (modalConfig.type === 'preco') {
            const colsPr = [ {label:'Produto', val:r=><div className="font-bold text-slate-800 truncate max-w-[200px]">{String(r.name)}</div>}, {label:'Qtd', align:'text-right', val:r=><span className="font-bold text-slate-800">{Number(r.qty).toLocaleString('pt-BR')} un</span>}, {label:'Menor Preço', align:'text-right', val:r=><div><div className="text-emerald-600 font-black">{formatCurrency(r.min)}</div></div>}, {label:'Preço Médio', align:'text-right', val:r=><span className="text-blue-700 font-black bg-blue-50/50 px-1.5 py-0.5 rounded print-force-bg">{formatCurrency(r.avg)}</span>}, {label:'Último Preço', align:'text-right', val:r=><div><div className="text-slate-800 font-black">{formatCurrency(r.lastPrice)}</div></div>} ];
            return <div className="p-2 lg:p-4 flex flex-col h-full"><ActiveFiltersDisplay /><div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col"><div className="overflow-y-auto custom-scroll flex-1"><DataTable cols={colsPr} data={modalProdutosData} /></div></div></div>;
        }

        if (modalConfig.type === 'capilaridade') {
            return (
                <div className="p-3 h-full min-h-[300px] min-w-[500px]">
                    <ActiveFiltersDisplay />
                    <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={chartDataCapilaridade} margin={{top:5, right:15, left:5, bottom:0}}>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} />
                            <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize:9, fontWeight:600, fill:'#94a3b8'}} />
                            <YAxis axisLine={false} tickLine={false} tick={{fontSize:9, fontWeight:600, fill:'#94a3b8'}} width={35} />
                            <Tooltip formatter={(v, n) => [Number(v||0).toLocaleString('pt-BR') + " PDVs", "Período"]} />
                            <Line type="monotone" dataKey="Total" name="Total Ativos (PDVs)" stroke="#0f172a" strokeWidth={3} dot={{r:3}} />
                        </LineChart>
                    </ResponsiveContainer>
                </div>
            );
        }

        const isA = modalConfig.type === 'alerta'; const isP = modalConfig.type === 'perdidos';
        const colsFB = [ {label:'Cliente', val:r=>renderClientCell(r)}, {label:'Local', align:'text-center', val:r=><span className="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[7px] font-bold">{String(r.state)}</span>}, ...(isA ? [{label:'Média Mensal', align:'text-right', val:r=><span className="font-bold text-slate-500">{formatCurrency(r.mediaMensal)}/mês</span>}, {label:'Status', align:'text-center', val:r=><span className="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[8px] font-black print-force-bg">{String(r.atraso)} meses s/ compra</span>}] : []), {label:'Fat. Atual', align:'text-right', val:r=><span className={`font-bold ${isP?'text-slate-400':'text-slate-800'}`}>{formatCurrency(r.fatCur)}</span>}, ...(isP || isA ? [{label:'Fat. Ant.', align:'text-right', val:r=><span className="text-rose-600 font-bold">{formatCurrency(r.fatComp)}</span>}] : []) ];
        return (
            <div className="p-2 lg:p-4 h-full flex flex-col">
                <ActiveFiltersDisplay />
                {modalInsight && <div className="bg-rose-50 border border-rose-200 text-rose-800 p-2 rounded-lg text-[9px] font-bold shadow-sm mb-2 flex items-center gap-1.5 shrink-0 print-force-bg"><Icon name="AlertCircle" size={12}/> {modalInsight}</div>}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-1"><div className="overflow-y-auto custom-scroll flex-1"><DataTable cols={colsFB} data={filteredModalDataList.slice(0, 100)} footer={<tr className="text-[8px] font-black text-slate-800 uppercase border-t border-slate-200 bg-slate-50 print-force-bg"><td colSpan={isA?3:2} className="py-2 px-3 text-right">{isP ? 'Total Perdido:' : 'Total Atual:'}</td><td className={`py-2 px-3 text-right text-[10px] font-bold ${isP?'text-slate-400':'text-emerald-600'}`}>{formatCurrency(totalModalFatCur)}</td>{(isP||isA) && <td className="py-2 px-3 text-right text-[10px] font-bold text-rose-600">{formatCurrency(totalModalFatComp)}</td>}</tr>} /></div></div>
            </div>
        );
    };

    if (isLoadingAuto) return (<div className="min-h-screen flex flex-col items-center justify-center bg-slate-100"><Icon name="Loader2" size={32} className="text-blue-600 animate-spin mb-4" /><h2 className="text-lg font-black text-slate-700">A processar...</h2></div>);

    if (!isLoaded || showUploadScreen) return (
        <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div className="bg-white p-5 rounded-2xl shadow-xl text-center max-w-sm w-full border border-slate-200">
                {errorMsg && (<div className="mb-3 flex items-start gap-1.5 text-left bg-rose-50 p-2 rounded-lg text-rose-700 font-bold text-[9px]"><Icon name="AlertCircle" size={16} className="shrink-0" />{errorMsg}</div>)}
                {!isAdminVerified ? (
                    <><div className="w-10 h-10 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center mx-auto mb-2 shadow-inner"><Icon name="Users" size={20} /></div><h2 className="text-base font-black text-slate-800 mb-0.5">Acesso Restrito</h2><p className="text-[9px] text-slate-500 mb-4 font-semibold">Introduza a sua credencial para continuar</p><input type="password" placeholder="Sua credencial..." value={passwordValue} onChange={e => setPasswordValue(e.target.value)} onKeyDown={e => e.key === 'Enter' && verifyPassword()} className={`w-full px-3 py-2 rounded-xl border text-center text-xs font-bold mb-3 bg-slate-50 focus:ring-2 outline-none transition-all ${passwordError ? 'border-rose-500 focus:ring-rose-200' : 'border-slate-200 focus:ring-blue-500'}`} />{passwordError && <p className="text-[9px] font-bold text-rose-500 mb-2">Credencial inválida. Tente novamente.</p>}<button onClick={verifyPassword} className="w-full bg-blue-600 text-white font-black text-[10px] py-2.5 rounded-xl hover:bg-blue-700 transition-colors shadow-md">Entrar no Dashboard</button></>
                ) : (
                    <><div className="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-2 shadow-inner"><Icon name="Upload" size={20} /></div><h2 className="text-base font-black text-slate-800 mb-0.5">Olá, {String(currentUser?.nome?.split(' ')[0] || '')}!</h2><p className="text-[9px] text-slate-500 mb-4 font-semibold">Por favor, carregue a base de dados (.csv).</p><label className="block w-full cursor-pointer bg-slate-900 text-white font-black text-[10px] py-2.5 rounded-xl hover:bg-black transition-colors shadow-md">Selecionar Base CSV<input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" /></label></>
                )}
            </div>
        </div>
    );

    return (
        <div id="main-dashboard-export-area" className="max-w-[1500px] mx-auto p-1 lg:p-2 text-slate-900 flex flex-col gap-1.5 relative bg-slate-50">
            {toastMessage && (<div className="fixed top-4 left-1/2 -translate-x-1/2 z-[200] bg-slate-900 text-white px-4 py-2 rounded-xl shadow-2xl flex items-center gap-2 text-[10px] font-black animate-bounce no-print" data-html2canvas-ignore="true"><Icon name="AlertCircle" size={14} className="text-blue-400" />{toastMessage}</div>)}
            {modalConfig.isOpen && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-2 no-print" data-html2canvas-ignore="true">
                    <div id="modal-export-area" className="bg-white rounded-2xl w-full max-w-5xl flex flex-col shadow-2xl overflow-hidden" style={{maxHeight: '94vh', height: '94vh'}}>
                        <div className="p-2 lg:p-3 border-b border-slate-100 flex flex-col bg-slate-50 gap-1.5 shrink-0">
                            <div className="flex justify-between items-start md:items-center w-full flex-wrap gap-2">
                                <div className="flex items-center gap-2">
                                    <div className={`w-8 h-8 rounded-xl flex items-center justify-center shadow-inner ${['novos','distribuidores'].includes(modalConfig.type)?'text-emerald-600 bg-emerald-100':['perdidos'].includes(modalConfig.type)?'text-rose-600 bg-rose-100':['top'].includes(modalConfig.type)?'text-fuchsia-600 bg-fuchsia-100':['alerta'].includes(modalConfig.type)?'text-amber-600 bg-amber-100':['preco','produtos','matriz','representatividade'].includes(modalConfig.type)?'text-blue-600 bg-blue-100':['abc','routing','manual'].includes(modalConfig.type)?'text-indigo-600 bg-indigo-100':'text-slate-600 bg-slate-100'}`}><Icon name={IconName} size={16}/></div>
                                    <div><h2 className="text-base font-black text-slate-800 leading-tight">{modalTitle}</h2><p className="text-[8px] font-bold text-slate-500 mt-0.5">{modalDesc}</p></div>
                                </div>
                                <div className="flex items-end gap-1.5 flex-wrap">
                                    {['distribuidores','produtos','top'].includes(modalConfig.type) && (
                                        <div className="flex flex-col gap-0.5 min-w-[150px]">
                                            <CustomSelect label={ modalConfig.type==='distribuidores'?'Distribuidor':modalConfig.type==='produtos'?'Produto':'Cliente' } options={ modalConfig.type==='distribuidores'?availableModalDistribuidores:modalConfig.type==='produtos'?availableModalProdutos:availableModalClientes } selected={ modalConfig.type==='distribuidores'?modalDistributorFilter:modalConfig.type==='produtos'?modalProductFilter:modalClientFilter } onChange={v=>{ if(modalConfig.type==='distribuidores')setModalDistributorFilter(v); else if(modalConfig.type==='produtos')setModalProductFilter(v); else if(modalConfig.type==='top')setModalClientFilter(v); }} placeholder="Pesquisar..." searchable={true} />
                                        </div>
                                    )}
                                    {modalConfig.type === 'representatividade' && (
                                        <div className="flex flex-col gap-0.5 min-w-[150px]">
                                            <CustomSelect label={`Selecionar ${pieChartMetric}`} options={representatividadeDetails?.options || []} selected={modalRepFilter} onChange={(v)=>{setModalRepFilter(v); setSelectedOpportunity(null);}} placeholder="Pesquisar..." searchable={true} />
                                        </div>
                                    )}
                                    {!['routing', 'assistente', 'manual'].includes(modalConfig.type) && (
                                        <div className="min-w-[120px]">
                                            <label className="text-[8px] font-black text-slate-400 uppercase tracking-wider">Busca na Tabela</label>
                                            <DebouncedInput value={localModalSearch} onChange={setLocalModalSearch} placeholder="Filtrar tabela..." icon="Search"/>
                                        </div>
                                    )}
                                    <div className="flex items-end gap-1 h-[26px]">
                                        {getModalBadge() && <div className="flex items-center h-full px-2 bg-blue-50 text-blue-700 rounded-md border border-blue-100 text-[9px] font-bold shadow-sm">{String(getModalBadge())}</div>}
                                        {modalConfig.type === 'representatividade' && representatividadeDetails && !representatividadeDetails.isOverview && showWhiteSpace && (<div className="flex items-center h-full px-2 bg-emerald-50 text-emerald-700 rounded-md border border-emerald-100 text-[9px] font-bold shadow-sm">Gap: +{formatCurrency(representatividadeDetails.totalGap)}</div>)}
                                        {!['manual','routing','assistente'].includes(modalConfig.type) && (<button onClick={handleExportModalExcelData} className="h-full px-2 bg-emerald-50 text-emerald-700 rounded-md flex items-center justify-center hover:bg-emerald-100 text-[9px] font-bold gap-1 shadow-sm border border-emerald-100 ml-0.5"><Icon name="FileSpreadsheet" size={10}/> Excel</button>)}
                                        <button onClick={()=>setModalConfig({isOpen:false, type:null})} className="w-[26px] h-full bg-white border border-slate-200 rounded-md flex items-center justify-center hover:text-rose-500 shadow-sm ml-0.5"><Icon name="X" size={12}/></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="p-0 overflow-y-auto modal-scroll flex-1 bg-slate-50/50 flex flex-col">{renderModalBody()}</div>
                    </div>
                </div>
            )}

            <div className="bg-white p-2.5 lg:p-3 rounded-2xl border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-2 shadow-sm no-print">
                <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 bg-white rounded-lg flex items-center justify-center border border-slate-200 overflow-hidden shadow-sm shrink-0">
                        <img id="youyou-img" src="youyou.png" alt="You You" className="w-8 h-8 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='block'; }} />
                        <Icon name="TrendingUp" size={16} className="text-blue-600 hidden" />
                    </div>
                    <div>
                        <div className="flex items-center gap-1 mb-0.5"><div className="w-1.5 h-3 bg-blue-600 rounded-full"></div><h1 className="text-base lg:text-lg font-black tracking-tight text-slate-800 uppercase leading-none whitespace-nowrap">PERFORMANCE COMERCIAL</h1></div>
                        <p className="text-slate-400 text-[8px] font-bold uppercase tracking-[0.1em] ml-2">Dashboard Sellout {currentUser && <span className="text-blue-500 font-black normal-case tracking-normal ml-0.5">&bull; {String(currentUser.nome.split(' ')[0])}</span>}</p>
                    </div>
                </div>
                <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                    <button onClick={()=>setTimeMode('U6M')} className={`px-2 py-1 text-[8px] uppercase tracking-wider font-black rounded transition-all ${timeMode==='U6M'?'bg-white shadow-sm text-blue-700':'text-slate-500 hover:text-slate-700'}`}>U6M</button>
                    <button onClick={()=>setTimeMode('UDM')} className={`px-2 py-1 text-[8px] uppercase tracking-wider font-black rounded transition-all ${timeMode==='UDM'?'bg-white shadow-sm text-blue-700':'text-slate-500 hover:text-slate-700'}`}>UDM</button>
                    <button onClick={()=>setTimeMode('YTD')} className={`px-2 py-1 text-[8px] uppercase tracking-wider font-black rounded transition-all ${timeMode==='YTD'?'bg-white shadow-sm text-blue-700':'text-slate-500 hover:text-slate-700'}`}>YTD</button>
                </div>
                <div className="flex items-center gap-1.5 flex-wrap" data-html2canvas-ignore="true">
                    {lastUpdate && <div className="text-[9px] font-bold text-slate-500 bg-slate-50 border border-slate-100 px-2 py-1 rounded-lg flex items-center gap-1"><Icon name="Clock" size={10} className="text-slate-400" /> <span className="text-slate-700">{String(lastUpdate)}</span></div>}
                    <button onClick={()=>openModal('assistente')} className="flex items-center gap-1 bg-fuchsia-50 text-fuchsia-700 border border-fuchsia-200 px-2.5 py-1 rounded-lg text-[9px] font-bold hover:bg-fuchsia-100 shadow-sm"><Icon name="Target" size={10}/> Analista Virtual</button>
                    <button onClick={()=>openModal('routing')} className="flex items-center gap-1 bg-indigo-600 text-white border border-indigo-700 px-2.5 py-1 rounded-lg text-[9px] font-bold hover:bg-indigo-700 shadow-sm"><Icon name="MapPin" size={10}/> Rotas</button>
                    <button onClick={()=>openModal('manual')} className="flex items-center gap-1 bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-lg text-[9px] font-bold hover:bg-blue-100 shadow-sm"><Icon name="BookOpen" size={10}/> Manual</button>
                    <button onClick={handleExportPDF} className="flex items-center gap-1 bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-1 rounded-lg text-[9px] font-bold hover:bg-rose-100 shadow-sm"><Icon name="Download" size={10}/> PDF</button>
                    <button onClick={()=>openModal('abc')} className="flex items-center gap-1 bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1 rounded-lg text-[9px] font-bold hover:bg-indigo-100 shadow-sm"><Icon name="Target" size={10}/> ABC</button>
                    <button onClick={()=>openModal('analitico')} className="flex items-center gap-1 bg-white text-slate-700 border border-slate-200 px-2.5 py-1 rounded-lg text-[9px] font-bold hover:bg-slate-50 shadow-sm"><Icon name="List" size={10}/> Dados</button>
                    <button onClick={()=>{setShowUploadScreen(true);setIsLoaded(false);}} className="flex items-center gap-1 bg-slate-900 text-white px-2.5 py-1 rounded-lg text-[9px] font-bold hover:bg-black shadow-sm"><Icon name="Upload" size={10}/> CSV</button>
                    <button onClick={()=>{setShowUploadScreen(true);setIsLoaded(false);setCurrentUser(null);setPasswordValue('');setIsAdminVerified(false);}} className="flex items-center gap-1 bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-1 rounded-lg text-[9px] font-bold hover:bg-rose-100 shadow-sm"><Icon name="UserMinus" size={10}/> Sair</button>
                </div>
            </div>

            <InsightsBar metrics={globalMetrics} />

            <div className="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap gap-1.5 items-end no-print">
                <div className="flex-1 min-w-[100px]"><DebouncedInput value={filters.searchCustomer} onChange={v => setFilters({...filters, searchCustomer: v})} placeholder="Cliente/CNPJ..." icon="Search" /></div>
                <div className="flex-1 min-w-[100px]"><DebouncedInput value={filters.searchProduct} onChange={v => setFilters({...filters, searchProduct: v})} placeholder="Produto..." icon="Package" /></div>
                <CustomMultiSelect label="Anos" options={availableOptions.years} selected={filters.years} onChange={v => setFilters({...filters, years: v})} placeholder="Todos" searchable={true} />
                <CustomMultiSelect label="Meses" options={availableOptions.months} selected={filters.months} onChange={v => setFilters({...filters, months: v})} placeholder="Todos" searchable={true} />
                <CustomMultiSelect label="Estado" options={availableOptions.states} selected={filters.state} onChange={v => setFilters({...filters, state: v})} placeholder="Todos" searchable={true} />
                <CustomMultiSelect label="Cidade" options={availableOptions.cities} selected={filters.city} onChange={v => setFilters({...filters, city: v})} placeholder="Todas" searchable={true} />
                <CustomMultiSelect label="Distribuidor" options={availableOptions.distributors} selected={filters.distributor} onChange={v => setFilters({...filters, distributor: v})} placeholder="Todos" searchable={true} />
                <CustomMultiSelect label="Tipo" options={availableOptions.customerTypes} selected={filters.customerType} onChange={v => setFilters({...filters, customerType: v})} placeholder="Todos" searchable={true} />
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-1.5">
                <KPICard title="Faturamento" metricKey="fatCur" growthKey="fatGrowth" icon="TrendingUp" color="slate" met={globalMetrics} yearComp={yearComparisonData} timeMode={timeMode} isCurrency={true} />
                <KPICard title={priceKpiMode === 'preco' ? 'Preço Médio' : 'Ticket Médio'} metricKey={priceKpiMode === 'preco' ? 'precoMedioCur' : 'ticketMedioCur'} growthKey={priceKpiMode === 'preco' ? 'precoMedioGrowth' : 'ticketMedioGrowth'} icon={priceKpiMode === 'preco' ? "Package" : "MapPin"} color="blue" onClick={priceKpiMode === 'preco' ? () => openModal('preco') : null} toggle={() => setPriceKpiMode(p => p === 'preco' ? 'ticket' : 'preco')} met={globalMetrics} yearComp={yearComparisonData} timeMode={timeMode} isCurrency={true} />
                <KPICard title="Capilaridade" metricKey="capCur" growthKey="capGrowth" icon="Users" color="slate" onClick={() => openModal('capilaridade')} met={globalMetrics} yearComp={yearComparisonData} timeMode={timeMode} isNumber={true} />
                <KPICard title="Clientes Novos" metricKey="novosMain" growthKey="fatNovosMain" icon="UserPlus" color="emerald" onClick={() => openModal('novos')} met={globalMetrics} yearComp={yearComparisonData} timeMode={timeMode} isNumber={true} />
                <KPICard title="Em Alerta" metricKey="alertaMain" icon="Bell" color="amber" onClick={() => openModal('alerta')} met={globalMetrics} yearComp={yearComparisonData} timeMode={timeMode} isNumber={true} />
                <KPICard title="Clientes Perdidos" metricKey="perdidosMain" growthKey="fatPerdidosMain" icon="UserMinus" color="rose" onClick={() => openModal('perdidos')} met={globalMetrics} yearComp={yearComparisonData} timeMode={timeMode} isNumber={true} />
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-2">
                <div className="lg:col-span-2 bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                    <div className="flex justify-between items-center mb-2">
                        <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-800 flex items-center gap-1.5"><Icon name="TrendingUp" size={12} className="text-blue-600" /> Evolução ({timeMode})</h3>
                        <div className="flex bg-slate-100 p-0.5 rounded-md shadow-sm border border-slate-200 no-print">
                            <button onClick={() => setEvolucaoMode('faturamento')} className={`px-2 py-1 text-[8px] font-bold rounded transition-colors ${evolucaoMode === 'faturamento' ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>R$</button>
                            <button onClick={() => setEvolucaoMode('quantidade')} className={`px-2 py-1 text-[8px] font-bold rounded transition-colors ${evolucaoMode === 'quantidade' ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>Unid.</button>
                        </div>
                    </div>
                    <div className="h-[200px] w-full">
                        <ResponsiveContainer width="100%" height="100%">
                            <LineChart data={evolutionChartData.data} margin={{ top: 5, right: 10, left: 5, bottom: 0 }}>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 9, fontWeight: 600, fill: '#94a3b8'}} />
                                <YAxis axisLine={false} tickLine={false} tick={{fontSize: 8, fontWeight: 600, fill: '#94a3b8'}} tickFormatter={v => formatShortNum(v)} width={45} />
                                <Tooltip formatter={(v, name) => [evolucaoMode === 'faturamento' ? formatCurrency(v) : (Number(v || 0).toLocaleString('pt-BR') + " un"), "Ano " + String(name)]} contentStyle={{borderRadius: '8px', border: 'none', boxShadow: '0 6px 12px rgba(0,0,0,0.1)'}} />
                                <Legend verticalAlign="top" height={20} iconType="circle" wrapperStyle={{ fontSize: '9px', fontWeight: 'bold', color: '#64748b' }} />
                                {evolutionChartMedia !== null && <ReferenceLine y={evolutionChartMedia} stroke="#94a3b8" strokeDasharray="4 4" label={{ position: 'top', value: `Média: ${evolucaoMode === 'faturamento' ? formatShortNum(evolutionChartMedia) : Number(evolutionChartMedia).toFixed(0)}`, fill: '#64748b', fontSize: 8, fontWeight: 'bold' }} />}
                                {evolutionChartData.lines.map((y, i) => {
                                    const isNewest = y === Math.max(...evolutionChartData.lines);
                                    const color = evolutionChartData.lines.length === 2 ? (isNewest ? '#3b82f6' : '#cbd5e1') : CHART_COLORS[i % CHART_COLORS.length];
                                    return <Line key={String(y)} type="monotone" dataKey={y} name={String(y)} stroke={color} strokeWidth={2.5} dot={{r: 2, fill: color, strokeWidth: 1.5}} activeDot={{r: 5}} connectNulls={false} />
                                })}
                            </LineChart>
                        </ResponsiveContainer>
                    </div>
                </div>
                <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex flex-col group print-force-bg">
                    <div className="flex justify-between items-center mb-2">
                        <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-800 flex items-center gap-1.5"><Icon name="MapPin" size={12} className="text-blue-600" /> Repres. ({timeMode})</h3>
                        <div className="flex items-center gap-1.5 no-print">
                            <div className="flex flex-wrap gap-0.5 bg-slate-100 p-0.5 rounded-md shadow-sm border border-slate-200">
                                {['UF', 'Distribuidor', 'Tipo Cliente', 'Unidade'].map(m => (<button key={m} onClick={() => setPieChartMetric(m)} className={`px-1.5 py-0.5 text-[7px] font-bold rounded transition-all ${pieChartMetric === m ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:bg-slate-50'}`}>{m}</button>))}
                            </div>
                            <button onClick={() => openModal('representatividade')} className="text-[8px] font-bold text-blue-600 bg-blue-50 px-1.5 py-1 rounded-md hover:bg-blue-100 shadow-sm border border-blue-200 flex items-center gap-1"><Icon name="List" size={10} /> Expan.</button>
                        </div>
                    </div>
                    <div className="h-[200px] w-full relative">
                        <ResponsiveContainer width="100%" height="100%">
                            <Treemap data={pieChartDataMain} dataKey="value" stroke="#fff" isAnimationActive={false} content={(props) => <CustomTreemapContentRecharts {...props} />}>
                                <Tooltip content={(props) => <CustomUFTooltip {...props} />} />
                            </Treemap>
                        </ResponsiveContainer>
                    </div>
                </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-2">
                <RankWidget title="Top Produtos" icon="Package" colorClass="text-blue-600" fillHex="#3b82f6" data={topProductsGlobal} isFat={false} onOpenModal={() => openModal('produtos')} timeMode={timeMode} yearComparison={yearComparisonData} />
                <RankWidget title="Top Distribuidores" icon="Truck" colorClass="text-emerald-500" fillHex="#10b981" data={topDistribuidoresGlobal} isFat={true} onOpenModal={() => openModal('distribuidores')} timeMode={timeMode} yearComparison={yearComparisonData} />
                <RankWidget title="Top Clientes" icon="Users" colorClass="text-fuchsia-500" fillHex="#f59e0b" data={topClientsGlobal} isFat={true} onOpenModal={() => openModal('top')} timeMode={timeMode} yearComparison={yearComparisonData} />
            </div>
            
            <div className="bg-white p-3 lg:p-4 rounded-2xl border border-slate-200 shadow-sm">
                <div className="flex justify-between items-center mb-3">
                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-800 flex items-center gap-1.5 cursor-help border-b border-dashed border-slate-400 w-fit pb-[1px]" title="Eixo X = Crescimento (%) | Eixo Y = Faturamento (R$)."><Icon name="Target" size={12} className="text-blue-600" /> Matriz Estratégica (BCG)</h3>
                    <div className="flex items-center gap-1.5 no-print">
                        <div className="flex bg-slate-100 p-0.5 rounded-md shadow-sm border border-slate-200">
                            <button onClick={() => setScatterMetric('clientes')} className={`px-2 py-1 text-[8px] font-bold rounded transition-colors ${scatterMetric === 'clientes' ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:bg-slate-50'}`}>Cli.</button>
                            <button onClick={() => setScatterMetric('produtos')} className={`px-2 py-1 text-[8px] font-bold rounded transition-colors ${scatterMetric === 'produtos' ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:bg-slate-50'}`}>Prod.</button>
                            <button onClick={() => setScatterMetric('distribuidores')} className={`px-2 py-1 text-[8px] font-bold rounded transition-colors ${scatterMetric === 'distribuidores' ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:bg-slate-50'}`}>Dist.</button>
                        </div>
                        <button onClick={() => openModal('matriz')} className="text-[8px] font-bold text-blue-600 bg-blue-50 px-1.5 py-1 rounded-md hover:bg-blue-100 shadow-sm border border-blue-200 flex items-center gap-1"><Icon name="List" size={10} /> Expandir</button>
                    </div>
                </div>
                <div className="flex items-center gap-3 mb-2 justify-center flex-wrap no-print">
                    <div className="flex items-center gap-1 text-[8px] font-bold text-emerald-600 cursor-help" title="Alta Faturamento e Alto Crescimento."><div className="w-2 h-2 rounded bg-emerald-500"></div> Estrelas</div>
                    <div className="flex items-center gap-1 text-[8px] font-bold text-blue-600 cursor-help" title="Alta Faturamento, mas Baixo Crescimento (ou queda)."><div className="w-2 h-2 rounded bg-blue-500"></div> Vacas Leiteiras</div>
                    <div className="flex items-center gap-1 text-[8px] font-bold text-amber-600 cursor-help" title="Baixo Faturamento, mas Alto Crescimento."><div className="w-2 h-2 rounded bg-amber-500"></div> Apostas</div>
                    <div className="flex items-center gap-1 text-[8px] font-bold text-rose-600 cursor-help" title="Baixo Faturamento e Baixo Crescimento."><div className="w-2 h-2 rounded bg-rose-500"></div> Abacaxis</div>
                </div>
                <div className="h-[200px] w-full">
                    {!scatterPlotData.hasHistory ? (
                        <div className="flex items-center justify-center h-full w-full bg-slate-50 rounded-xl border border-slate-200 border-dashed"><p className="text-xs font-bold text-slate-400">Sem dados históricos suficientes para gerar a Matriz.</p></div>
                    ) : (
                        <ResponsiveContainer width="100%" height="100%">
                            <ScatterChart margin={{ top: 10, right: 15, bottom: 0, left: -10 }}>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                <XAxis type="number" dataKey="growth" name="Crescimento" unit="%" tick={{fontSize: 8, fontWeight: 600, fill: '#94a3b8'}} tickFormatter={(v) => `${v}%`} axisLine={false} tickLine={false} />
                                <YAxis type="number" dataKey="fatCur" name="Faturamento" tick={{fontSize: 8, fontWeight: 600, fill: '#94a3b8'}} tickFormatter={v => formatShortNum(v)} axisLine={false} tickLine={false} width={40} />
                                <ZAxis type="number" dataKey="fatCur" range={[20, 150]} />
                                <Tooltip cursor={{strokeDasharray: '3 3'}} content={(props) => <CustomScatterTooltip {...props} />} />
                                <ReferenceLine y={scatterPlotData.avgFat} stroke="#cbd5e1" strokeDasharray="4 4" label={{ position: 'insideTopLeft', value: 'Média Fat.', fill: '#94a3b8', fontSize: 7, fontWeight: 'bold' }} />
                                <ReferenceLine x={scatterPlotData.thresholdG} stroke="#cbd5e1" strokeDasharray="4 4" label={{ position: 'insideBottomRight', value: scatterPlotData.avgGrowth < 0 ? 'Mínimo (0%)' : 'Média Cresc.', fill: '#94a3b8', fontSize: 7, fontWeight: 'bold' }} />
                                <Scatter name="Performance" data={scatterPlotData.filtered} fillOpacity={0.8}>{scatterPlotData.filtered.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.fillHex} />)}</Scatter>
                            </ScatterChart>
                        </ResponsiveContainer>
                    )}
                </div>
            </div>
            <div className="text-center mt-0.5 pb-2 border-t border-slate-200 pt-2 no-print"><p className="text-[9px] text-slate-400 font-semibold tracking-wider">DESENVOLVIDO POR: <a href="mailto:george.gos@gmail.com" className="text-blue-500 hover:text-blue-700 font-black hover:underline transition-colors ml-0.5">GEORGE SILVA</a></p></div>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DashboardApp />);
</script>
</body>
</html>
