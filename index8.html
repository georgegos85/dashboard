<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Comercial ISP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; } 
        .recharts-cartesian-grid-horizontal line { stroke: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background-color: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-export { display: none !important; }
            .shadow-md, .shadow-lg, .shadow-sm, .shadow-xl, .shadow-2xl { box-shadow: none !important; border: 1px solid #e2e8f0 !important; }
            .custom-scroll, .modal-scroll, .overflow-y-auto { overflow: visible !important; max-height: none !important; }
            .recharts-wrapper { page-break-inside: avoid !important; }
            div[class*="bg-white"] { page-break-inside: avoid !important; }
            .print-modal-bg { position: static !important; background: transparent !important; backdrop-filter: none !important; padding: 0 !important; }
            .print-modal-wrapper { max-height: none !important; box-shadow: none !important; border: none !important; border-radius: 0 !important; width: 100% !important; max-width: none !important; margin: 0 !important; }
        }
        .pdf-mode .no-export { display: none !important; }
        .pdf-mode .shadow-md, .pdf-mode .shadow-lg, .pdf-mode .shadow-sm, .pdf-mode .shadow-xl, .pdf-mode .shadow-2xl { box-shadow: none !important; border: 1px solid #e2e8f0 !important; }
        .pdf-mode ::-webkit-scrollbar { display: none !important; }
        .pdf-mode * { scrollbar-width: none !important; }
        .pdf-mode .recharts-wrapper { page-break-inside: avoid !important; }
        .pdf-mode div[class*="bg-white"] { page-break-inside: avoid !important; }
        .pdf-mode.has-modal > div:first-child { display: none !important; }
        .pdf-mode .custom-scroll, .pdf-mode .modal-scroll, .pdf-mode .overflow-y-auto, .pdf-mode .overflow-hidden { overflow: visible !important; max-height: none !important; }
        .pdf-mode .modal-overlay-bg { position: absolute !important; background: transparent !important; backdrop-filter: none !important; padding: 0 !important; min-height: 100vh !important; min-width: 100vw !important; align-items: flex-start !important; overflow: visible !important; }
        .pdf-mode .print-modal-wrapper { max-height: none !important; box-shadow: none !important; border: none !important; border-radius: 0 !important; width: max-content !important; min-width: 100% !important; max-width: none !important; margin: 0 !important; overflow: visible !important; }
        .pdf-mode tr { page-break-inside: avoid !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, BarChart, Bar, Cell, Treemap, Legend, ReferenceLine, ScatterChart, Scatter, ZAxis, ComposedChart } = window.Recharts;

        const USUARIOS = [
            { nome: "George Silva (Admin)", estados: "ALL", role: "admin", hash: "Z3NpbHZhMDAx" }, { nome: "Diretoria", estados: "ALL", role: "admin", hash: "YWRtaW4uZGly" }, { nome: "George Silva (Regional)", estados: ["AL", "BA", "PE", "SE"], role: "ev", hash: "Z2VvcmdlLnNpbHZh" }, { nome: "Luiz Hamilton", estados: ["AC", "AP", "AM", "MA", "PA", "RO", "RR"], role: "ev", hash: "bHVpei5oYW1pbHRvbg==" }, { nome: "Carine Pellegrino", estados: ["CE", "PB", "PI", "RN"], role: "ev", hash: "Y2FyaW5lLnBlbGxlZ3Jpbm8=" }, { nome: "Diego Garcia", estados: ["DF", "GO", "TO"], role: "ev", hash: "ZGllZ28uZ2FyY2lh" }, { nome: "Aldemir Neto", estados: ["ES", "RJ"], role: "ev", hash: "YWxkZW1pci5uZXRv" }, { nome: "Caique Musto", estados: ["MG"], role: "ev", hash: "Y2FpcXVlLm11c3Rv" }, { nome: "Diego Ceirutti", estados: ["PR", "SC"], role: "ev", hash: "ZGllZ28uY2VpcnV0dGk=" }, { nome: "Fiad Neto", estados: ["RS", "SC"], role: "ev", hash: "ZmlhZC5uZXRv" }, { nome: "Juliana Passo", estados: ["SP"], role: "ev", hash: "anVsaWFuYS5wYXNzbw==" }
        ];

        const SVG_PATHS = {
            TrendingUp: `<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>`, TrendingDown: `<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>`, Search: `<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>`, ChevronDown: `<polyline points="6 9 12 15 18 9"/>`, MapPin: `<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>`, Truck: `<rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle>`, Users: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`, X: `<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`, Clock: `<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>`, Package: `<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>`, List: `<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>`, AlertCircle: `<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>`, Loader2: `<path d="M21 12a9 9 0 1 1-6.219-8.56"/>`, Upload: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>`, Target: `<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>`, Download: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`, FileSpreadsheet: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M8 13h2"></path><path d="M8 17h2"></path><path d="M14 13h2"></path><path d="M14 17h2"></path>`, BookOpen: `<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>`, UserPlus: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>`, UserMinus: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="22" y1="11" x2="16" y2="11"/>`, Bell: `<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path>`, Filter: `<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>`, Info: `<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>`, Zap: `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>`, Copy: `<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>`, Check: `<polyline points="20 6 9 17 4 12"></polyline>`, Map: `<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line>`, ArrowLeft: `<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>`, Sparkles: `<path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z"/>`, Send: `<line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>`
        };

        const Icon = ({ name, size = 14, className = "" }) => SVG_PATHS[name] ? <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`inline-flex items-center justify-center ${name === 'Loader2' ? 'animate-spin' : ''} ${className}`} width={size} height={size} dangerouslySetInnerHTML={{ __html: SVG_PATHS[name] }} /> : null;

        const CHART_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#64748b', '#14b8a6'];
        const MONTH_NAMES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

        const removeAccents = (str) => str ? String(str).normalize('NFD').replace(/[\u0300-\u036f]/g, '') : '';
        const getFirstName = (name) => { if (!name || typeof name !== 'string') return 'Parceiro'; const str = name.trim(); if (str === 'N/I' || str.toLowerCase() === 'não informado') return 'Parceiro'; return str.split(' ')[0]; };
        const formatCurrency = (val) => { const n = Number(val) || 0; return n >= 1e6 ? `R$ ${(n/1e6).toFixed(2)}M` : n >= 1e3 ? `R$ ${(n/1e3).toFixed(2)}k` : `R$ ${n.toFixed(2)}`; };
        const formatShortNum = (val) => { const n = Number(val) || 0; return n >= 1e6 ? `${(n/1e6).toFixed(1)}M` : n >= 1e3 ? `${(n/1e3).toFixed(1)}k` : n.toFixed(1); };
        const formatCnpj = (cnpj) => String(cnpj||'').replace(/\D/g, '');
        const formatYAxisTick = (val) => { const s = String(val || ''); return s.length > 13 ? s.substring(0, 13) + '...' : s; };

        const getRankBadge = (r) => {
            if (!r) return null;
            if (r <= 20) return <span className="bg-amber-100 text-amber-700 border border-amber-200 px-1 py-0.5 rounded text-[7px] font-black shrink-0">TOP 20 (#{r})</span>;
            if (r <= 50) return <span className="bg-blue-100 text-blue-700 border border-blue-200 px-1 py-0.5 rounded text-[7px] font-black shrink-0">TOP 50 (#{r})</span>;
            return <span className="bg-slate-100 text-slate-600 border border-slate-200 px-1 py-0.5 rounded text-[7px] font-black shrink-0">RANK #{r}</span>;
        };

        const exportToExcel = (dataToExport, title) => {
            if (!dataToExport || dataToExport.length === 0) { alert("Sem dados."); return; } 
            const h = Object.keys(dataToExport[0]); const csvLines = [h.join(';')];
            dataToExport.forEach(row => { csvLines.push(h.map(k => `"${String(row[k] || '').replace(/"/g, '""')}"`).join(';')); });
            const b = new Blob(['\uFEFF' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' }); 
            const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = `${title}.csv`; l.click();
        };

        const InfoTooltip = ({ text }) => {
            if (!text) return null;
            return (
                <div className="relative group flex items-center justify-center no-export ml-1 cursor-help">
                    <Icon name="Info" size={12} className="text-slate-300 hover:text-blue-500 transition-colors" />
                    <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 bg-slate-800 text-white text-[10px] font-semibold p-2.5 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-[100] pointer-events-none text-center leading-relaxed normal-case tracking-normal border border-slate-700">
                        {text}<div className="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px] border-[5px] border-transparent border-t-slate-800"></div>
                    </div>
                </div>
            );
        };

        const ActionButton = ({ scriptText, label = "Script" }) => {
            const [copied, setCopied] = useState(false);
            const handleCopy = (e) => {
                e.stopPropagation(); const textArea = document.createElement("textarea"); textArea.value = scriptText; document.body.appendChild(textArea); textArea.select();
                try { document.execCommand('copy'); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (err) {} document.body.removeChild(textArea);
            };
            return (
                <button onClick={handleCopy} className={`flex items-center gap-1 px-2 py-1.5 rounded text-[9px] font-black transition-all border shadow-sm ${copied ? 'bg-emerald-500 text-white border-emerald-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-blue-600'}`} title="Copiar mensagem para abordagem">
                    <Icon name={copied ? "Check" : "Copy"} size={10} />{copied ? "Copiado!" : label}
                </button>
            );
        };

        const DebouncedInput = ({ value, onChange, placeholder, icon }) => {
            const [localVal, setLocalVal] = useState(value || ''); const ref = useRef(onChange);
            useEffect(() => { ref.current = onChange; }, [onChange]); useEffect(() => { setLocalVal(value || ''); }, [value]);
            useEffect(() => { const id = setTimeout(() => ref.current(localVal), 300); return () => clearTimeout(id); }, [localVal]);
            return (
                <div className="relative flex items-center h-[28px]">
                    <Icon name={icon} className="absolute left-2.5 text-slate-400 pointer-events-none" size={12} />
                    <input type="text" placeholder={placeholder} value={localVal} onChange={e => setLocalVal(e.target.value)} className="w-full h-full pl-7 pr-6 bg-white border border-slate-200 rounded-lg text-[10px] font-semibold focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 shadow-sm transition-shadow" />
                    {localVal && <button onClick={() => { setLocalVal(''); ref.current(''); }} className="absolute right-0 w-7 h-full flex items-center justify-center text-slate-400 hover:text-rose-500"><Icon name="X" size={10} /></button>}
                </div>
            );
        };

        const CustomSelect = ({ label, options, selected, onChange, placeholder, multi = false, searchable = false }) => {
            const [isOpen, setIsOpen] = useState(false); const [term, setTerm] = useState(''); const ref = useRef(null);
            useEffect(() => { const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); }; document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h); }, []);
            const filteredOptions = searchable && term ? options.filter(o => removeAccents(String(o.label || '').toLowerCase()).includes(removeAccents(term.toLowerCase()))) : options;
            const toggleSingle = (val) => { onChange(val); setIsOpen(false); setTerm(''); };
            const toggleMulti = (val) => { if (selected.includes(val)) onChange(selected.filter(x => x !== val)); else onChange([...selected, val]); };
            const toggleAll = () => { if (options.length > 0 && options.every(o => selected.includes(o.value))) onChange([]); else onChange(options.map(o => o.value)); };
            const displayLabel = multi ? (selected.length === 0 ? placeholder : selected.length === options.length ? 'Todos' : `${selected.length} selec.`) : (options.find(o => o.value === selected)?.label || placeholder);
            return (
                <div className="relative flex flex-col gap-1 min-w-[120px] w-full" ref={ref}>
                    {label && <label className="text-[8px] font-black text-slate-500 uppercase tracking-wider">{label}</label>}
                    <div className="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-[10px] font-bold text-slate-700 cursor-pointer flex justify-between items-center shadow-sm h-[28px] hover:bg-slate-50 transition-colors" onClick={() => setIsOpen(!isOpen)}>
                        <span className="truncate flex-1 max-w-[90%]">{displayLabel}</span><Icon name="ChevronDown" size={10} className="text-slate-400 shrink-0 ml-1" />
                    </div>
                    {isOpen && (
                        <div className="absolute top-[105%] left-0 w-full min-w-[180px] bg-white border border-slate-200 rounded-xl shadow-xl z-50 max-h-64 flex flex-col overflow-hidden">
                            {searchable && <div className="p-2 border-b border-slate-100 bg-slate-50 flex items-center relative"><Icon name="Search" size={10} className="text-slate-400 absolute left-4 pointer-events-none" /><input type="text" placeholder="Pesquisar..." className="w-full pl-7 pr-4 py-1 text-[10px] font-semibold bg-white border border-slate-200 rounded-lg outline-none focus:ring-1 focus:ring-blue-500" onChange={e => setTerm(e.target.value)} value={term} /></div>}
                            <div className="overflow-y-auto custom-scroll p-1.5 flex flex-col gap-0.5" style={{maxHeight: '180px'}}>
                                {multi && <label className="flex items-center gap-2 text-[10px] font-bold cursor-pointer px-2 py-1.5 hover:bg-slate-100 rounded-lg transition-colors"><input type="checkbox" checked={options.length > 0 && options.every(o => selected.includes(o.value))} onChange={toggleAll} className="w-3 h-3 accent-blue-600 rounded" /> <span className="text-blue-700">Selecionar Todos</span></label>}
                                {filteredOptions.map(o => <label key={String(o.value)} onClick={() => { if (!multi) toggleSingle(o.value); }} className={`flex items-center gap-2 text-[10px] font-semibold cursor-pointer px-2 py-1.5 rounded-lg transition-colors ${!multi && selected === o.value ? 'bg-blue-50 text-blue-700' : 'hover:bg-slate-50'}`}>{multi && <input type="checkbox" checked={selected.includes(o.value)} onChange={() => toggleMulti(o.value)} className="w-3 h-3 accent-blue-600 rounded" />}<span className="truncate">{String(o.label)}</span></label>)}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CustomMultiSelect = ({ label, options, selected = [], onChange, placeholder, searchable }) => <CustomSelect label={label} options={options} selected={selected} onChange={onChange} placeholder={placeholder} searchable={searchable} multi={true} />;

        const SortHeader = ({ label, isRight, activeSort, sortDir, onSort }) => (
            <th className={`px-3 py-2 ${isRight ? 'text-right' : 'text-left'} cursor-pointer hover:bg-slate-100 transition-colors border-b border-slate-100`} onClick={onSort}>
                <div className={`flex items-center gap-1.5 ${isRight ? 'justify-end' : ''} ${activeSort ? 'text-blue-600' : ''}`}>{String(label)} {activeSort && <Icon name="ChevronDown" size={10} className={`transition-transform ${sortDir === 'asc' ? 'rotate-180' : ''}`} />}</div>
            </th>
        );

        const DataTable = ({ cols, data, footer, onRowClick, selectedRowValue, rowKey="name" }) => (
            <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm mt-3">
                <div className="overflow-y-auto custom-scroll" style={{maxHeight: '300px'}}>
                    <table className="w-full text-left border-collapse min-w-[600px]">
                        <thead className="bg-slate-50 sticky top-0 shadow-sm z-10"><tr className="text-[9px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-200">{cols.map((c, i) => c.sort ? <SortHeader key={i} label={c.label} isRight={c.align === 'text-right'} activeSort={c.activeSort} sortDir={c.sortDir} onSort={c.sort} /> : <th key={i} className={`px-3 py-2 ${c.align || 'text-left'}`}>{String(c.label)}</th>)}</tr></thead>
                        <tbody className="bg-white">
                            {data.map((r, i) => (<tr key={i} onClick={() => { if (onRowClick) onRowClick(r); }} className={`border-b border-slate-50 transition-colors ${onRowClick ? 'cursor-pointer hover:bg-slate-50' : 'hover:bg-slate-50'} ${selectedRowValue && selectedRowValue === r[rowKey] ? 'bg-blue-50 border-l-4 border-blue-500' : 'border-l-4 border-transparent'}`}>{cols.map((c, j) => <td key={j} className={`px-3 py-2 text-[10px] ${c.align || 'text-left'}`}>{c.val(r, i)}</td>)}</tr>))}
                            {data.length === 0 && <tr><td colSpan={cols.length} className="py-8 text-center text-[10px] text-slate-400 font-bold bg-slate-50/50">Sem dados correspondentes para exibir.</td></tr>}
                        </tbody>
                        {footer && <tfoot className="bg-slate-50 sticky bottom-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] border-t border-slate-200">{footer}</tfoot>}
                    </table>
                </div>
            </div>
        );

        const CustomTreemapContentRecharts = (props) => {
            const { x, y, width, height, index, name, value, root } = props;
            if (width < 25 || height < 25) return null; 
            const sName = String(name || ''); const pct = root && root.value ? ((value / root.value) * 100).toFixed(1) : 0;
            return (
                <g>

                if (modalConfig.type === 'preco') return `${modalPrecosData.length.toLocaleString('pt-BR')} produtos`;
                if (modalConfig.type === 'analitico') return `${modalDataFiltered.length.toLocaleString('pt-BR')} linhas`;
                if (modalConfig.type === 'matriz') return `${scatterPlotData.filtered.length.toLocaleString('pt-BR')} itens`;
                if (modalConfig.type === 'routing' && !selectedRouteKey) return `${routingSuggestions.length.toLocaleString('pt-BR')} rotas viáveis`;
                if (modalConfig.type === 'representatividade' && representatividadeDetails && !representatividadeDetails.isOverview) { const cList = selectedOpportunity ? representatividadeDetails.clientList.filter(c => { const p = representatividadeDetails.clientProductMap.get(c.cKey); return !p || !p.has(selectedOpportunity); }) : representatividadeDetails.clientList; return `${cList.length.toLocaleString('pt-BR')} clientes`; }
                return null;
            }; 

            const renderModalInsights = () => {
                if (isPdfMode) return null; const ins = [];
                if (modalConfig.type === 'representatividade' && representatividadeDetails) {
                    if (representatividadeDetails.isOverview) { ins.push({ type: 'info', icon: 'Info', text: `Selecione um segmento no menu acima para liberar o Raio-X detalhado de ${pieChartMetric}.` }); } else if (showWhiteSpace) { ins.push({ type: 'success', icon: 'Target', text: `Oportunidade de ${formatCurrency(representatividadeDetails.totalGap)} mapeada em expansão de mix (Cross-sell).` }); if (representatividadeDetails.opportunities.length > 0) { ins.push({ type: 'warning', icon: 'Package', text: `Alvo principal: Oferecer "${representatividadeDetails.opportunities[0].name}" (Gap potencial de ${formatCurrency(representatividadeDetails.opportunities[0].gap)}).` }); } } else { ins.push({ type: 'info', icon: 'TrendingUp', text: `Este segmento isolado movimenta ${formatCurrency(representatividadeDetails.fatCur)} com ${representatividadeDetails.capilaridade} clientes ativos.` }); }
                } else if (modalConfig.type === 'abc' && abcDataRaw) {
                    ins.push({ type: 'success', icon: 'TrendingUp', text: `A Curva A sustenta a operação: apenas ${abcDataRaw.countA} itens/clientes garantem ${formatCurrency(abcDataRaw.fatA)}.` }); if (abcDataRaw.list.length > 0) ins.push({ type: 'warning', icon: 'Target', text: `O líder do ranking (${abcDataRaw.list[0].name}) domina sozinho ${abcDataRaw.list[0].pct.toFixed(1)}% da visão atual.` });
                } else if (modalConfig.type === 'matriz') {
                    const e = scatterPlotData.filtered.filter(d => d.quadrant === 'Estrela').length; const ab = scatterPlotData.filtered.filter(d => d.quadrant === 'Abacaxi').length;
                    ins.push({ type: 'success', icon: 'Zap', text: `Excelente! Você tem ${e} "Estrelas" puxando o faturamento para cima.` }); if (ab > 0) ins.push({ type: 'danger', icon: 'AlertCircle', text: `Atenção na base: Existem ${ab} "Abacaxis" consumindo esforço com baixo retorno financeiro.` });
                } else if (['top', 'produtos', 'distribuidores'].includes(modalConfig.type) && detailedEntityData) {
                    const d = detailedEntityData; if (d.growth > 5) ins.push({ type: 'success', icon: 'TrendingUp', text: `Forte tração: crescimento acelerado de ${d.growth.toFixed(1)}% frente ao período anterior.` }); else if (d.growth < -5) ins.push({ type: 'danger', icon: 'TrendingDown', text: `Alerta de desempenho: Queda de ${Math.abs(d.growth).toFixed(1)}% em comparação ao histórico.` }); if (modalConfig.type === 'top' && d.capilaridade > 0) ins.push({ type: 'info', icon: 'MapPin', text: `O ticket médio atual por PDV deste agrupamento está em ${formatCurrency(d.curTotal / d.capilaridade)}.`});
                } else if (modalConfig.type === 'analitico') {
                    const f = modalDataFiltered.reduce((a,b) => a + (b._amount||0), 0); ins.push({ type: 'info', icon: 'List', text: `Você está lendo os dados em nível bruto: ${modalDataFiltered.length} transações que somam ${formatCurrency(f)}.` });
                } else if (['novos', 'perdidos', 'alerta'].includes(modalConfig.type)) {
                    const f = filteredModalDataList.reduce((a,b) => a + (b.fatCur||b.fatComp||0), 0); if (modalConfig.type === 'novos') ins.push({ type: 'success', icon: 'UserPlus', text: `${filteredModalDataList.length} clientes ativados injetaram ${formatCurrency(f)} de dinheiro novo no pipeline.` }); if (modalConfig.type === 'perdidos') ins.push({ type: 'danger', icon: 'UserMinus', text: `Sangramento: O negócio perdeu ${formatCurrency(f)} em volume de compras com a saída destas contas.` }); if (modalConfig.type === 'alerta') ins.push({ type: 'warning', icon: 'Bell', text: `Risco de Churn: R$ ${formatCurrency(f)} podem evaporar caso as ${filteredModalDataList.length} contas listadas não recomprarem logo.` });
                } else if (modalConfig.type === 'preco' && modalPrecosData.length > 0) {
                    ins.push({ type: 'info', icon: 'Package', text: `Avaliando a flutuação e a variação histórica de preço dos ${modalPrecosData.length} produtos de maior impacto comercial selecionados.` });
                } else if (modalConfig.type === 'routing') {
                    if (!selectedRouteKey && routingSuggestions.length > 0) {
                        const totalRisk = routingSuggestions.reduce((a, b) => a + b.totalRiskFat, 0);
                        ins.push({ type: 'warning', icon: 'Map', text: `A inteligência mapeou ${routingSuggestions.length} rotas viáveis (+5 clientes). Há ${formatCurrency(totalRisk)} de faturamento em risco nessas regiões.` });
                    }
                }
                if (ins.length === 0) return null;
                return (
                    <div className="bg-blue-50/60 rounded-xl p-3 shadow-sm flex flex-col md:flex-row items-start md:items-center gap-3 border border-blue-200/60 animate-fade-in no-export">
                        <div className="flex items-center gap-2 shrink-0 border-r border-blue-200/60 pr-3"><div className="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center shadow-inner"><Icon name="Zap" size={16} /></div><div><h3 className="text-[10px] font-black uppercase tracking-widest text-blue-900">Insights</h3><p className="text-[8px] text-blue-600 font-bold">Visão de Raio-X</p></div></div>
                        <div className="flex-1 flex flex-wrap gap-2 w-full">{ins.map((insObj, i) => <div key={i} className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[10px] font-semibold border shadow-sm ${insObj.type === 'success' ? 'bg-white text-emerald-700 border-emerald-200' : insObj.type === 'danger' ? 'bg-white text-rose-700 border-rose-200' : insObj.type === 'warning' ? 'bg-white text-amber-700 border-amber-200' : 'bg-white text-slate-700 border-slate-200'}`}><Icon name={insObj.icon} size={12} className={`shrink-0 ${insObj.type === 'success' ? 'text-emerald-500' : insObj.type === 'danger' ? 'text-rose-500' : insObj.type === 'warning' ? 'text-amber-500' : 'text-slate-400'}`} /><span>{insObj.text}</span></div>)}</div>
                    </div>
                );
            };

            const renderModalBody = () => {
                if (modalConfig.type === 'ask') {
                    return (
                        <div className="flex flex-col h-full bg-slate-50 relative">
                            {/* Input Area */}
                            <div className="bg-white p-4 lg:p-6 border-b border-slate-200 shadow-sm sticky top-0 z-10 shrink-0">
                                <div className="max-w-4xl mx-auto">
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <Icon name="Sparkles" size={18} className="text-fuchsia-500" />
                                        </div>
                                        <input type="text" value={askQuery} onChange={(e) => setAskQuery(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleProcessAsk()} placeholder="O que você deseja ver? Ex: Top 20 clientes apenas de ONT em SP" className="w-full pl-11 pr-16 py-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-fuchsia-500 focus:bg-white shadow-inner transition-all" autoFocus />
                                        <button onClick={handleProcessAsk} className="absolute inset-y-2 right-2 px-4 bg-slate-900 text-white rounded-lg font-black text-xs hover:bg-black transition-colors shadow-md flex items-center gap-1.5"><Icon name="Send" size={14}/> Analisar</button>
                                    </div>
                                    <div className="mt-3 flex flex-wrap gap-2">
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider mr-2 flex items-center">Sugestões:</span>
                                        <button onClick={()=>{setAskQuery('Clientes em queda em SP'); handleProcessAsk();}} className="text-[9px] font-bold bg-white border border-slate-200 text-slate-600 px-2.5 py-1 rounded-full hover:border-fuchsia-300 hover:text-fuchsia-700 transition-colors shadow-sm">"Clientes em queda em SP"</button>
                                        <button onClick={()=>{setAskQuery('Top 15 clientes perdidos de ONT'); handleProcessAsk();}} className="text-[9px] font-bold bg-white border border-slate-200 text-slate-600 px-2.5 py-1 rounded-full hover:border-fuchsia-300 hover:text-fuchsia-700 transition-colors shadow-sm">"Top 15 clientes perdidos de ONT"</button>
                                        <button onClick={()=>{setAskQuery('Top 5 produtos em crescimento'); handleProcessAsk();}} className="text-[9px] font-bold bg-white border border-slate-200 text-slate-600 px-2.5 py-1 rounded-full hover:border-fuchsia-300 hover:text-fuchsia-700 transition-colors shadow-sm">"Top 5 produtos em crescimento"</button>
                                    </div>
                                </div>
                            </div>

                            {/* Result Area */}
                            <div className="flex-1 overflow-y-auto p-4 lg:p-6 custom-scroll">
                                <div className="max-w-4xl mx-auto">
                                    {!askResult && !askQuery && (
                                        <div className="flex flex-col items-center justify-center text-center py-16 animate-fade-in">
                                            <div className="w-20 h-20 bg-fuchsia-50 rounded-full flex items-center justify-center text-fuchsia-300 mb-6 shadow-inner"><Icon name="Sparkles" size={40} /></div>
                                            <h3 className="text-xl font-black text-slate-800 mb-2">Qual dado você precisa agora?</h3>
                                            <p className="text-sm text-slate-500 font-medium max-w-lg leading-relaxed">A inteligência analítica interpreta seus pedidos em linguagem natural e cruza os dados do painel em tempo real para montar visões customizadas.</p>
                                        </div>
                                    )}

                                    {askResult?.loading && (
                                        <div className="flex flex-col items-center justify-center py-16 animate-fade-in text-fuchsia-600">
                                            <Icon name="Loader2" size={40} className="mb-4" />
                                            <p className="text-sm font-black animate-pulse">Processando a requisição e montando a visão...</p>
                                        </div>
                                    )}

                                    {askResult?.error && (
                                        <div className="bg-rose-50 border border-rose-200 p-6 rounded-xl shadow-sm text-center animate-fade-in max-w-lg mx-auto mt-10">
                                            <Icon name="AlertCircle" size={32} className="text-rose-400 mx-auto mb-3" />
                                            <h4 className="text-rose-800 font-black text-sm mb-2">Não consegui processar essa visão</h4>
                                            <p className="text-rose-600 text-[11px] font-medium leading-relaxed">{askResult.error}</p>
                                        </div>
                                    )}

                                    {askResult && !askResult.loading && !askResult.error && (
                                        <div className="animate-fade-in space-y-4">
                                            <div className="flex items-center gap-2 mb-2">
                                                <div className="w-1.5 h-6 bg-fuchsia-500 rounded-full"></div>
                                                <h3 className="text-lg font-black text-slate-800 capitalize uppercase tracking-tight">{askResult.title}</h3>
                                            </div>

                                            {askResult.type === 'chart' && (
                                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-md h-[350px]">
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        <LineChart data={askResult.data} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                            <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 10, fontWeight: 700, fill: '#64748b'}} />
                                                            <YAxis axisLine={false} tickLine={false} tick={{fontSize: 10, fontWeight: 700, fill: '#64748b'}} tickFormatter={v => askResult.isQty ? (v>=1000 ? (Number(v)/1000).toFixed(1)+'k' : v) : formatShortNum(v)} width={45} />
                                                            <Tooltip formatter={(v) => [askResult.isQty ? (Number(v).toLocaleString('pt-BR') + " un") : formatCurrency(v), askResult.isQty ? 'Quantidade' : 'Faturamento']} contentStyle={{borderRadius: '8px', border: '1px solid #e2e8f0', boxShadow: '0 4px 6px -1px rgba(0,0,0,0.1)', fontSize: '11px', fontWeight: 'bold'}} />
                                                            <Line type="monotone" dataKey={askResult.isQty ? 'qty' : 'valor'} name={askResult.isQty ? 'Volume' : 'Faturamento'} stroke="#d946ef" strokeWidth={3} dot={{r: 4, strokeWidth: 2, fill: '#fff'}} activeDot={{r: 6}} isAnimationActive={true} />
                                                        </LineChart>
                                                    </ResponsiveContainer>
                                                </div>
                                            )}

                                            {askResult.type === 'table' && (
                                                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-md">
                                                    <table className="w-full text-left border-collapse">
                                                        <thead className="bg-slate-50">
                                                            <tr className="text-[10px] font-black text-slate-500 uppercase tracking-wider border-b border-slate-200">
                                                                <th className="px-4 py-3 text-center w-16">Rank</th>
                                                                <th className="px-4 py-3">{askResult.listType === 'product' ? 'Produto' : askResult.listType === 'distributor' ? 'Distribuidor' : askResult.listType === 'city' ? 'Cidade' : askResult.listType === 'uf' ? 'UF' : 'Cliente'}</th>
                                                                {askResult.listType === 'client' && <th className="px-4 py-3 text-center">Localidade</th>}
                                                                <th className="px-4 py-3 text-right">Fat. Atual</th>
                                                                {(askResult.isQueda || askResult.isCrescimento || askResult.title.includes('Perdidos')) && <th className="px-4 py-3 text-right">Fat. Ant.</th>}
                                                                {(askResult.isQueda || askResult.isCrescimento) && <th className="px-4 py-3 text-right">Evolução</th>}
                                                                <th className="px-4 py-3 text-right">Vol. Atual</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="bg-white divide-y divide-slate-50">
                                                            {askResult.data.map((r, i) => (
                                                                <tr key={i} className="hover:bg-slate-50 transition-colors">
                                                                    <td className="px-4 py-3 text-center"><span className="text-slate-400 font-bold text-xs">#{r.rank}</span></td>
                                                                    <td className="px-4 py-3">
                                                                        <div className="font-bold text-slate-800">{r.name}</div>
                                                                        {r.cnpj && <div className="text-[9px] text-slate-400 mt-0.5">{formatCnpj(r.cnpj)}</div>}
                                                                    </td>
                                                                    {askResult.listType === 'client' && (
                                                                        <td className="px-4 py-3 text-center">
                                                                            <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[9px] font-bold">{r.state || '-'}</span>
                                                                            <div className="text-[8px] text-slate-500 mt-1">{r.city || '-'}</div>
                                                                        </td>
                                                                    )}
                                                                    <td className="px-4 py-3 text-right font-black text-slate-700">{formatCurrency(r.fatCur)}</td>
                                                                    {(askResult.isQueda || askResult.isCrescimento || askResult.title.includes('Perdidos')) && <td className="px-4 py-3 text-right font-bold text-slate-400">{formatCurrency(r.fatComp)}</td>}
                                                                    {(askResult.isQueda || askResult.isCrescimento) && (
                                                                        <td className="px-4 py-3 text-right">
                                                                            {r.growth !== null && r.growth !== undefined ? (
                                                                                <span className={`px-2 py-1 rounded text-[9px] font-black ${r.growth >= 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                                                                                    {r.growth > 0 ? '+' : ''}{Number(r.growth).toFixed(1)}%
                                                                                </span>
                                                                            ) : <span className="text-slate-400">-</span>}
                                                                        </td>
                                                                    )}
                                                                    <td className="px-4 py-3 text-right font-bold text-slate-500">{Number(r.qtyCur || 0).toLocaleString('pt-BR')} un</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    );
                }

                if (modalConfig.type === 'routing') {
                    if (routingSuggestions.length === 0) {
                        return (
                            <div className="flex flex-col items-center justify-center h-full p-10 text-center text-slate-500 min-h-[400px]">
                                <Icon name="Map" size={48} className="mb-4 text-emerald-300 mt-4" />
                                <h3 className="text-lg font-black text-slate-800 mb-2">Excelente! Tudo sob controle.</h3>
                                <p className="max-w-md text-xs">O algoritmo não encontrou nenhuma cidade com volume suficiente (5+ clientes) de clientes perdidos, em queda ou em alerta nos filtros atuais.</p>
                            </div>
                        );
                    }

                    if (!selectedRouteKey) {
                        return (
                            <div className="p-3 lg:p-4 space-y-3">
                                {renderModalInsights()}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    {routingSuggestions.map(r => (
                                        <div key={r.key} onClick={()=>setSelectedRouteKey(r.key)} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:border-blue-500 hover:shadow-md transition-all group">
                                            <div className="flex justify-between items-start mb-3">
                                                <div><h3 className="font-black text-slate-800 text-sm group-hover:text-blue-700 transition-colors">{r.city}</h3><p className="text-[10px] font-bold text-slate-400">Estado: {r.uf}</p></div>
                                                <span className="bg-slate-100 text-slate-700 text-[10px] font-black px-2 py-0.5 rounded border border-slate-200">{r.totalTargets} Visitas</span>
                                            </div>
                                            <div className="pt-3 border-t border-slate-100 flex justify-between items-end">
                                                <div><p className="text-[8px] font-black text-rose-500 uppercase tracking-wider mb-0.5">Recuperação Potencial</p><p className="text-lg font-black text-slate-800">{formatCurrency(r.totalRiskFat)}</p></div>
                                                <div className="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="Map" size={14}/></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        );
                    } else {
                        const route = routingSuggestions.find(r => r.key === selectedRouteKey);
                        if (!route) return null;
                        const colsRoute = [
                            {label: 'Prioridade', align: 'text-center', val: r => <span className={`px-2 py-0.5 rounded text-[8px] font-black border ${r.priority===1?'bg-rose-50 text-rose-700 border-rose-200':r.priority===2?'bg-amber-50 text-amber-700 border-amber-200':'bg-blue-50 text-blue-700 border-blue-200'}`}>{r.priority===1?'MÁXIMA':r.priority===2?'ALTA':'MÉDIA'}</span>},
                            {label: 'Cliente', val: r => <div><div className="font-bold text-slate-800 truncate max-w-[200px]">{r.name}</div><div className="text-[8px] text-slate-400 mt-0.5">{formatCnpj(r.cnpj)}</div></div>},
                            {label: 'Classificação Motivo', val: r => <span className="font-semibold text-slate-600 text-[9px]">{r.routingReason}</span>},
                            {label: 'Risco Estimado (R$)', align: 'text-right', val: r => <span className="font-black text-slate-800">{formatCurrency(r.riskValue)}</span>},
                            {label: 'Ação Recomendada', align: 'text-center', val: r => <ActionButton label="Agendar Visita" scriptText={`Olá ${getFirstName(r.name)}! Estarei na região de ${route.city} nos próximos dias e faço questão de passar por aí para tomarmos um café e apresentar umas condições que preparei pro seu CNPJ. Qual o melhor dia para você?`} />}
                        ];
                        return (
                            <div className="p-3 lg:p-4 space-y-3">
                                <button onClick={()=>setSelectedRouteKey(null)} className="flex items-center gap-1.5 text-[10px] font-bold text-slate-500 hover:text-blue-600 mb-2 transition-colors bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm w-fit"><Icon name="ArrowLeft" size={12} /> Voltar para o Painel de Rotas</button>
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-md flex justify-between items-center text-white">
                                    <div className="flex items-center gap-3">
                                        <div className="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center border border-blue-500/30"><Icon name="Map" size={24} /></div>
                                        <div><h3 className="font-black text-xl text-white">{route.city} / {route.uf}</h3><p className="text-[10px] text-slate-400 font-semibold mt-0.5">Viagem sugerida com {route.totalTargets} clientes em risco.</p></div>
                                    </div>
                                    <div className="text-right"><p className="text-[9px] font-black uppercase text-rose-400 mb-0.5">Pipeline em Risco</p><p className="font-black text-2xl text-white">{formatCurrency(route.totalRiskFat)}</p></div>
                                </div>
                                <DataTable cols={colsRoute} data={route.clients} />
                            </div>
                        );
                    }
                }

                if (modalConfig.type === 'representatividade' && representatividadeDetails) {

                            <><div className="w-12 h-12 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-inner"><Icon name="Users" size={24} /></div><h2 className="text-lg font-black text-slate-800 mb-1">Acesso Restrito</h2><p className="text-[10px] text-slate-500 mb-4 font-semibold">Insira a sua credencial</p><input type="password" placeholder="Sua credencial..." value={passwordValue} onChange={e => setPasswordValue(e.target.value)} onKeyDown={e => e.key === 'Enter' && verifyPassword()} className={`w-full px-3 py-2.5 rounded-lg border text-center font-bold text-xs mb-2 bg-slate-50 focus:ring-2 outline-none transition-all ${passwordError ? 'border-rose-500 focus:ring-rose-200' : 'border-slate-200 focus:ring-blue-500'}`} />{passwordError && <p className="text-[9px] font-bold text-rose-500 mb-2">Credencial inválida. Tente novamente.</p>}<button onClick={verifyPassword} className="w-full bg-blue-600 text-white font-black text-xs py-2.5 rounded-lg hover:bg-blue-700 transition-colors shadow-sm">Entrar no Dashboard</button></>
                        ) : (
                            <><div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-inner"><Icon name="Upload" size={24} /></div><h2 className="text-lg font-black text-slate-800 mb-1">Olá, {String(currentUser?.nome?.split(' ')[0] || '')}!</h2><p className="text-[10px] text-slate-500 mb-4 font-semibold">Suba a base (.csv) para gerar as visões.</p><label className="block w-full cursor-pointer bg-slate-900 text-white font-black text-xs py-3 rounded-lg hover:bg-black transition-colors shadow-sm">Selecionar CSV<input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" /></label></>
                        )}
                    </div>
                </div>
            );

            return (
                <div id="main-dashboard-export-area" className={`max-w-[1600px] mx-auto p-2 lg:p-3 text-slate-900 flex flex-col gap-1.5 ${modalConfig.isOpen ? 'has-modal' : ''} ${isPdfMode ? 'pdf-mode' : ''}`}>
                    {isPdfMode && <div className="fixed inset-0 z-[99999] bg-slate-900/80 flex flex-col items-center justify-center text-white no-export" style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0 }}><Icon name="Loader2" size={64} className="animate-spin text-blue-500 mb-6" /><h2 className="text-3xl font-black mb-2">Exportando PDF...</h2><p className="text-sm font-semibold text-slate-300">Aguarde um momento.</p></div>}
                    
                    <div className={modalConfig.isOpen ? 'print:hidden main-dashboard-content' : 'main-dashboard-content'}>
                        <div className="bg-white p-2 lg:p-3 rounded-xl border border-slate-200 shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-2 mb-1.5">
                            <div className="flex items-center gap-3">
                                <div className="relative w-10 h-10 shrink-0"><img src="youyou.webp" alt="Logo" className="absolute inset-0 w-10 h-10 object-contain drop-shadow-md bg-white rounded-full border border-slate-200 p-0.5 z-10" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} /><div className="absolute inset-0 w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center border border-indigo-200 shadow-inner z-0"><Icon name="TrendingUp" size={18} className="text-indigo-600"/></div></div>
                                <div><div className="flex items-center gap-1.5 mb-0.5"><div className="w-1 h-4 bg-blue-600 rounded-full shadow-sm"></div><h1 className="text-base font-black tracking-tight text-slate-800 uppercase leading-none whitespace-nowrap">Performance Comercial</h1></div><p className="text-slate-400 text-[8px] font-bold uppercase tracking-widest ml-2.5">Dashboard Sellout {currentUser && <span className="text-blue-500 font-black normal-case tracking-normal ml-1">&bull; {String(currentUser.nome.split(' ')[0])}</span>}</p></div>
                            </div>
                            <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200 shadow-inner no-export">
                                <button onClick={()=>setTimeMode('U6M')} className={`px-2.5 py-1 text-[8px] uppercase tracking-wider font-black rounded-md transition-all shadow-sm ${timeMode==='U6M'?'bg-white text-blue-700':'text-slate-500 hover:text-slate-700'}`}>U6M</button>
                                <button onClick={()=>setTimeMode('UDM')} className={`px-2.5 py-1 text-[8px] uppercase tracking-wider font-black rounded-md transition-all shadow-sm ${timeMode==='UDM'?'bg-white text-blue-700':'text-slate-500 hover:text-slate-700'}`}>UDM</button>
                                <button onClick={()=>setTimeMode('YTD')} className={`px-2.5 py-1 text-[8px] uppercase tracking-wider font-black rounded-md transition-all shadow-sm ${timeMode==='YTD'?'bg-white text-blue-700':'text-slate-500 hover:text-slate-700'}`}>YTD</button>
                            </div>
                            <div className="flex items-center gap-1.5 flex-wrap no-export">
                                {lastUpdate && <div className="text-[9px] font-bold text-slate-500 bg-slate-50 border border-slate-200 shadow-sm px-2 py-1 rounded-lg flex items-center gap-1"><Icon name="Clock" size={10} className="text-slate-400" /> Atualizado: <span className="text-slate-700">{String(lastUpdate)}</span></div>}
                                <button onClick={()=>openModal('manual')} className="flex items-center gap-1 bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-lg text-[9px] font-bold shadow-sm"><Icon name="BookOpen" size={10}/> Manual</button>
                                <button onClick={exportToPDF} className="flex items-center gap-1 bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-1 rounded-lg text-[9px] font-bold shadow-sm"><Icon name="Download" size={10}/> PDF</button>
                                <button onClick={handleExportMainExcel} className="flex items-center gap-1 bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-lg text-[9px] font-bold shadow-sm"><Icon name="FileSpreadsheet" size={10}/> Excel</button>
                                <button onClick={()=>openModal('ask')} className="flex items-center gap-1 bg-fuchsia-50 text-fuchsia-700 border border-fuchsia-200 px-2.5 py-1 rounded-lg text-[9px] font-black shadow-sm hover:bg-fuchsia-100 transition-colors group"><Icon name="Sparkles" size={10} className="group-hover:animate-pulse"/> Perguntar aos Dados</button>
                                <button onClick={()=>openModal('routing')} className="flex items-center gap-1 bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-lg text-[9px] font-black shadow-sm hover:bg-amber-100 transition-colors"><Icon name="Map" size={10}/> Planejar Rotas</button>
                                <button onClick={()=>openModal('abc')} className="flex items-center gap-1 bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1 rounded-lg text-[9px] font-bold shadow-sm"><Icon name="Target" size={10}/> Curva ABC</button>
                                <button onClick={()=>openModal('analitico')} className="flex items-center gap-1 bg-white text-slate-700 border border-slate-200 px-2.5 py-1 rounded-lg text-[9px] font-bold shadow-sm"><Icon name="List" size={10}/> Analítico</button>
                                <button onClick={()=>{setShowUploadScreen(true);setIsLoaded(false);}} className="flex items-center gap-1 bg-slate-900 text-white px-2.5 py-1 rounded-lg text-[9px] font-bold shadow-sm"><Icon name="Upload" size={10}/> CSV</button>
                            </div>
                        </div>

                        {isPdfMode && !modalConfig.isOpen && <div className="bg-blue-50/50 p-2.5 rounded-xl border border-blue-100 shadow-sm flex items-start gap-2 mb-1.5 animate-fade-in"><div className="p-1.5 bg-blue-100 rounded-lg text-blue-600 shrink-0"><Icon name="Filter" size={14} /></div><div className="flex flex-col"><h4 className="text-[9px] font-black uppercase text-blue-900 tracking-wider">Filtros Ativos</h4><p className="text-[10px] font-semibold text-blue-800">{activeFiltersSummary}</p></div></div>}
                        {!isPdfMode && !modalConfig.isOpen && <SmartInsightsPanel metrics={globalMetrics} comparison={yearComparisonData} />}

                        <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm mb-1.5 print:hidden">
                            <div className="flex flex-wrap gap-2 items-center">
                                <div className="w-[100px] shrink-0"><CustomMultiSelect label="" options={availableOptions.years} selected={filters.years} onChange={v => setFilters(p => ({...p, years: v}))} placeholder="Ano" /></div>
                                <div className="w-[120px] shrink-0"><CustomMultiSelect label="" options={availableOptions.months} selected={filters.months} onChange={v => setFilters(p => ({...p, months: v}))} placeholder="Mês" /></div>
                                <div className="flex-1 min-w-[140px]"><DebouncedInput value={filters.searchCustomer} onChange={(v) => setFilters(p => ({...p, searchCustomer: v}))} placeholder="Cliente/CNPJ..." icon="Search" /></div>
                                <div className="flex-1 min-w-[140px]"><DebouncedInput value={filters.searchProduct} onChange={(v) => setFilters(p => ({...p, searchProduct: v}))} placeholder="Produto..." icon="Search" /></div>
                                <div className="w-[100px] shrink-0"><CustomMultiSelect label="" options={availableOptions.states} selected={filters.state} onChange={v => setFilters(p => ({...p, state: v}))} placeholder="UF" searchable /></div>
                                <div className="flex-1 min-w-[160px] max-w-[220px]"><CustomMultiSelect label="" options={availableOptions.distributors} selected={filters.distributor} onChange={v => setFilters(p => ({...p, distributor: v}))} placeholder="Distribuidor" searchable /></div>
                                <button onClick={() => setShowAdvancedFilters(!showAdvancedFilters)} className={`px-2 md:px-3 h-[28px] rounded-lg text-[9px] font-black flex items-center justify-center gap-1 transition-colors border shrink-0 ${showAdvancedFilters ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}><Icon name="Filter" size={12} /> <span className="hidden md:inline">{showAdvancedFilters ? 'Ocultar' : 'Mais Filtros'}</span></button>
                            </div>
                            {showAdvancedFilters && (
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2 pt-2 border-t border-slate-100 animate-fade-in">
                                    <CustomMultiSelect label="Cidade" options={availableOptions.cities} selected={filters.city} onChange={v => setFilters(p => ({...p, city: v}))} placeholder="Cidades..." searchable />
                                    <CustomMultiSelect label="Tipo Cliente" options={availableOptions.customerTypes} selected={filters.customerType} onChange={v => setFilters(p => ({...p, customerType: v}))} placeholder="Tipos..." searchable />
                                    <div className="col-span-2 md:col-span-2 flex justify-end mt-1"><button onClick={() => setFilters(initialFilters)} className="text-[9px] font-bold text-slate-400 hover:text-rose-500 flex items-center gap-1 px-2 py-1 rounded bg-slate-50 border border-slate-200"><Icon name="X" size={10} /> Limpar Todos</button></div>
                                </div>
                            )}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-2 mb-2">
                            <KPICard title="Faturamento" metricKey="fatCur" growthKey="fatGrowth" icon="TrendingUp" color="emerald" met={globalMetrics} isCurrency onClick={()=>openModal('analitico')} tooltip="Faturamento total gerado." />
                            <KPICard title="Capilaridade" metricKey="capCur" growthKey="capGrowth" icon="Users" color="blue" met={globalMetrics} isNumber onClick={()=>openModal('capilaridade')} tooltip="Número de clientes ativos." />
                            <KPICard title="Ticket Médio" metricKey="ticketMedioCur" growthKey="ticketMedioGrowth" icon="MapPin" color="indigo" met={globalMetrics} isCurrency tooltip="Valor médio gasto por cliente." />
                            <KPICard title="Novos" metricKey="novosMain" customSubtitle={`+${formatCurrency(globalMetrics.fatNovosMain)}`} icon="UserPlus" color="emerald" met={globalMetrics} onClick={()=>openModal('novos')} tooltip="Clientes ativados recentemente." />
                            <KPICard title="Perdidos" metricKey="perdidosMain" customSubtitle={`-${formatCurrency(globalMetrics.fatPerdidosMain)}`} icon="UserMinus" color="rose" met={globalMetrics} onClick={()=>openModal('perdidos')} tooltip="Fuga de carteira atual (Churn)." />
                            <KPICard title="Em Alerta" metricKey="alertaMain" customSubtitle={`Risco: ${formatCurrency(globalMetrics.fatAlertaMain)}`} icon="AlertCircle" color="amber" met={globalMetrics} onClick={()=>openModal('alerta')} tooltip="Risco iminente de Churn." />
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-2 mb-2">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm lg:col-span-2 flex flex-col">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-[11px] font-black uppercase tracking-widest text-slate-800 flex items-center gap-1"><Icon name="TrendingUp" className="text-blue-600"/> Evolução Mensal</h3>
                                    <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 no-export">
                                        <button onClick={()=>setEvolucaoMode('faturamento')} className={`px-2 py-1 text-[8px] font-bold rounded-md ${evolucaoMode==='faturamento'?'bg-white text-blue-600 shadow-sm':'text-slate-500'}`}>R$ Fat.</button>
                                        <button onClick={()=>setEvolucaoMode('quantidade')} className={`px-2 py-1 text-[8px] font-bold rounded-md ${evolucaoMode==='quantidade'?'bg-white text-blue-600 shadow-sm':'text-slate-500'}`}>Unid.</button>
                                    </div>
                                </div>
                                <div className="flex-1 w-full min-h-[250px]">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={evolutionChartData.data} margin={{top:5, right:10, left:-20, bottom:0}}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                            <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 9, fontWeight: 700, fill: '#94a3b8'}} />
                                            <YAxis axisLine={false} tickLine={false} tick={{fontSize: 9, fontWeight: 700, fill: '#94a3b8'}} tickFormatter={v => evolucaoMode === 'faturamento' ? formatShortNum(v) : (v>=1000 ? (Number(v)/1000).toFixed(1)+'k' : v)} width={40} />
                                            <Tooltip formatter={(v) => [evolucaoMode === 'faturamento' ? formatCurrency(v) : (Number(v || 0).toLocaleString('pt-BR') + " un"), evolucaoMode === 'faturamento' ? 'Faturamento' : 'Quantidade']} contentStyle={{borderRadius: '8px', border: '1px solid #e2e8f0', boxShadow: '0 4px 6px -1px rgba(0,0,0,0.1)', fontSize: '10px', fontWeight: 'bold'}} />
                                            <Legend verticalAlign="top" height={20} iconType="circle" wrapperStyle={{fontSize:'9px', fontWeight:'bold', color:'#64748b'}} />
                                            {evolutionChartMedia && <ReferenceLine y={evolutionChartMedia} stroke="#94a3b8" strokeDasharray="4 4" />}
                                            {evolutionChartData.lines.map((y, i) => <Line key={y} type="monotone" dataKey={String(y)} name={String(y)} stroke={CHART_COLORS[i % CHART_COLORS.length]} strokeWidth={y === Math.max(...evolutionChartData.lines) ? 3 : 2} dot={{r: 3, strokeWidth: 1.5}} activeDot={{r: 5}} connectNulls={false} isAnimationActive={!isPdfMode} />)}
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-[11px] font-black uppercase tracking-widest text-slate-800 flex items-center gap-1"><Icon name="MapPin" className="text-emerald-600"/> Representatividade</h3>
                                    <div className="flex items-center gap-2">
                                        <select className="bg-slate-50 border border-slate-200 text-slate-700 text-[9px] font-bold rounded-lg px-2 py-1 outline-none no-export" value={pieChartMetric} onChange={(e)=>setPieChartMetric(e.target.value)}>
                                            <option>UF</option><option>Cidade</option><option>Distribuidor</option><option>Tipo Cliente</option><option>Unidade</option>
                                        </select>
                                        <button onClick={()=>openModal('representatividade')} className="text-[9px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition-colors shadow-sm no-export">Raio-X</button>
                                    </div>
                                </div>
                                <div className="flex-1 w-full min-h-[250px]">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <Treemap data={pieChartDataMain} dataKey="value" stroke="#fff" fill="#10b981" content={<CustomTreemapContentRecharts />} isAnimationActive={!isPdfMode}>
                                            <Tooltip content={<CustomUFTooltip />} />
                                        </Treemap>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-2 mb-2">
                            <RankWidget title="Top Clientes" icon="Target" colorClass="text-blue-600" fillHex="#3b82f6" data={topClientsGlobal} isFat={true} onOpenModal={()=>openModal('top')} yearComparison={yearComparisonData} isPdfMode={isPdfMode} tooltip="Maiores compradores do período." />
                            <RankWidget title="Top Produtos" icon="Package" colorClass="text-emerald-600" fillHex="#10b981" data={topProductsGlobal} isFat={false} onOpenModal={()=>openModal('produtos')} yearComparison={yearComparisonData} isPdfMode={isPdfMode} tooltip="Produtos mais populares por quantidade." />
                            <RankWidget title="Top Distribuidores" icon="Truck" colorClass="text-amber-600" fillHex="#f59e0b" data={topDistribuidoresGlobal} isFat={true} onOpenModal={()=>openModal('distribuidores')} yearComparison={yearComparisonData} isPdfMode={isPdfMode} tooltip="Maiores distribuidores do período." />
                        </div>

                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-2">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-[11px] font-black uppercase tracking-widest text-slate-800 flex items-center gap-1"><Icon name="Target" className="text-rose-600"/> Matriz de Performance</h3>
                                <div className="flex items-center gap-2">
                                    <label className="flex items-center gap-1 text-[9px] font-bold text-slate-500 cursor-pointer no-export"><input type="checkbox" checked={matrixShowInactive} onChange={(e)=>setMatrixShowInactive(e.target.checked)} className="w-3 h-3 accent-rose-500" /> Inativos</label>
                                    <select className="bg-slate-50 border border-slate-200 text-slate-700 text-[9px] font-bold rounded-lg px-2 py-1 outline-none no-export" value={scatterMetric} onChange={(e)=>setScatterMetric(e.target.value)}>
                                        <option value="clientes">Clientes</option><option value="produtos">Produtos</option><option value="distribuidores">Distribuidores</option>
                                    </select>
                                    <button onClick={()=>openModal('matriz')} className="text-[9px] font-bold text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200 hover:bg-rose-100 transition-colors shadow-sm no-export">Raio-X</button>
                                </div>
                            </div>
                            <div className="h-[300px] w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <ScatterChart margin={{ top: 10, right: 20, bottom: 20, left: 20 }}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis type="number" dataKey="fatCur" name="Faturamento" tickFormatter={formatShortNum} tick={{fontSize: 9, fontWeight: 700, fill: '#64748b'}} axisLine={false} tickLine={false} />
                                        <YAxis type="number" dataKey="growth" name="Crescimento" tickFormatter={v => v.toFixed(0) + '%'} tick={{fontSize: 9, fontWeight: 700, fill: '#64748b'}} axisLine={false} tickLine={false} />
                                        <ZAxis type="number" range={[40, 400]} />
                                        <Tooltip cursor={{strokeDasharray: '3 3'}} content={<CustomScatterTooltip />} />
                                        {scatterPlotData?.avgFat > 0 && <ReferenceLine x={scatterPlotData.avgFat} stroke="#94a3b8" strokeDasharray="4 4" label={{ position: 'top', value: 'Média Fat.', fill: '#64748b', fontSize: 8, fontWeight: 'bold' }} />}
                                        <ReferenceLine y={scatterPlotData?.thresholdG || 0} stroke="#94a3b8" strokeDasharray="4 4" label={{ position: 'right', value: 'Média Cresc.', fill: '#64748b', fontSize: 8, fontWeight: 'bold' }} />
                                        <Scatter data={scatterPlotData?.filtered || []} isAnimationActive={!isPdfMode}>
                                            {(scatterPlotData?.filtered || []).map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={entry.fillHex} />
                                            ))}
                                        </Scatter>
                                    </ScatterChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>

                    {modalConfig.isOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 print-modal-bg modal-overlay-bg bg-slate-900/40 backdrop-blur-sm">
                            <div id="modal-export-area" className="bg-white rounded-2xl w-full max-w-6xl max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 animate-fade-in overflow-hidden print-modal-wrapper relative">
                                <div className="flex justify-between items-center p-4 lg:p-5 border-b border-slate-200 bg-slate-50 shrink-0 no-export">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shadow-inner"><Icon name={IconName} size={20} /></div>
                                        <div><h2 className="text-lg font-black text-slate-800 tracking-tight">{modalTitle}</h2><p className="text-[10px] text-slate-500 font-semibold">{modalDesc} {getModalBadge() && <span className="ml-2 inline-flex items-center px-2 py-0.5 rounded text-[8px] font-black bg-blue-100 text-blue-700">{getModalBadge()}</span>}</p></div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button onClick={handleExportModalExcelData} className="p-2 text-emerald-600 hover:bg-emerald-50 rounded-lg transition-colors border border-transparent hover:border-emerald-200" title="Exportar Excel"><Icon name="FileSpreadsheet" size={16} /></button>
                                        <button onClick={exportToPDF} className="p-2 text-rose-600 hover:bg-rose-50 rounded-lg transition-colors border border-transparent hover:border-rose-200" title="Exportar PDF"><Icon name="Download" size={16} /></button>
                                        <div className="w-px h-6 bg-slate-200 mx-1"></div>
                                        <button onClick={() => setModalConfig({ isOpen: false, type: null })} className="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors"><Icon name="X" size={18} /></button>
                                    </div>
                                </div>
                                <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex flex-wrap gap-2 items-center shrink-0 no-export">
                                    <div className="flex-1 min-w-[200px]"><DebouncedInput value={localModalSearch} onChange={setLocalModalSearch} placeholder="Pesquisar neste raio-x..." icon="Search" /></div>
                                    {['capilaridade','analitico','abc','matriz'].includes(modalConfig.type) && <div className="w-[120px]"><CustomSelect label="" options={[{label:'Todos os Anos', value:'Todos'}, ...availableOptions.years]} selected={modalYearFilter} onChange={setModalYearFilter} placeholder="Ano" /></div>}
                                    {availableModalUfs.length > 0 && modalConfig.type !== 'routing' && <div className="min-w-[150px]"><CustomMultiSelect label="" options={modalUfOptionsFormatted} selected={modalUfFilter} onChange={setModalUfFilter} placeholder="Filtrar UF..." searchable /></div>}
                                    {modalConfig.type === 'top' && <div className="min-w-[200px] flex-1"><CustomSelect label="" options={availableModalClientes} selected={modalClientFilter} onChange={setModalClientFilter} placeholder="Selecionar Cliente..." searchable /></div>}
                                    {modalConfig.type === 'distribuidores' && <div className="min-w-[200px] flex-1"><CustomSelect label="" options={availableModalDistribuidores} selected={modalDistributorFilter} onChange={setModalDistributorFilter} placeholder="Selecionar Distribuidor..." searchable /></div>}
                                    {modalConfig.type === 'produtos' && <div className="min-w-[200px] flex-1"><CustomSelect label="" options={availableModalProdutos} selected={modalProductFilter} onChange={setModalProductFilter} placeholder="Selecionar Produto..." searchable /></div>}
                                    {modalConfig.type === 'abc' && <div className="min-w-[200px] flex-1"><CustomSelect label="" options={abcOptions} selected={modalAbcFilter} onChange={setModalAbcFilter} placeholder="Selecionar Item..." searchable /></div>}
                                    {modalConfig.type === 'representatividade' && <div className="min-w-[200px] flex-1"><CustomSelect label="" options={representatividadeDetails?.options || []} selected={modalRepFilter} onChange={setModalRepFilter} placeholder={`Selecionar ${pieChartMetric}...`} searchable /></div>}
                                </div>
                                <div className="flex-1 overflow-y-auto modal-scroll bg-slate-50 relative pb-10">{renderModalBody()}</div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardApp />);
    </script>
</body>
</html>
